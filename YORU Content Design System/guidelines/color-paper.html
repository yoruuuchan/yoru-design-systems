<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:20px 24px;background:#fff;font-family:var(--font-body);color:var(--ink-2)}.lbl{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-5)}.row{display:flex;gap:10px}.sw{flex:1;height:56px;border:1px solid var(--line-1);border-radius:2px}</style></head><body>
<div class="row">
<div style="flex:1"><div class="sw" style="background:var(--surface-page)"></div><div class="lbl" style="margin-top:6px">surface-page</div><div class="lbl" style="color:var(--ink-3)">页面底 #F2F5F5</div></div><div style="flex:1"><div class="sw" style="background:var(--paper-1)"></div><div class="lbl" style="margin-top:6px">paper-1</div><div class="lbl" style="color:var(--ink-3)">局部白</div></div><div style="flex:1"><div class="sw" style="background:var(--paper-2)"></div><div class="lbl" style="margin-top:6px">paper-2</div><div class="lbl" style="color:var(--ink-3)">图片底</div></div><div style="flex:1"><div class="sw" style="background:var(--paper-3)"></div><div class="lbl" style="margin-top:6px">paper-3</div><div class="lbl" style="color:var(--ink-3)">内嵌块</div></div><div style="flex:1"><div class="sw" style="background:var(--paper-4)"></div><div class="lbl" style="margin-top:6px">paper-4</div><div class="lbl" style="color:var(--ink-3)">表头</div></div><div style="flex:1"><div class="sw" style="background:var(--line-1)"></div><div class="lbl" style="margin-top:6px">line-1</div><div class="lbl" style="color:var(--ink-3)">发丝线</div></div><div style="flex:1"><div class="sw" style="background:var(--line-2)"></div><div class="lbl" style="margin-top:6px">line-2</div><div class="lbl" style="color:var(--ink-3)">分隔线</div></div><div style="flex:1"><div class="sw" style="background:var(--line-3)"></div><div class="lbl" style="margin-top:6px">line-3</div><div class="lbl" style="color:var(--ink-3)">强分隔</div></div>
</div></body></html>
