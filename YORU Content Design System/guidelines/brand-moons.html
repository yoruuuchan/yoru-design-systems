<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:20px 24px;background:#fff;font-family:var(--font-body);color:var(--ink-2)}.lbl{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-5)}.tile{flex:1;border:1px solid var(--line-1);border-radius:2px;padding:16px 14px;display:flex;flex-direction:column;gap:9px}.pg{font-family:var(--font-fangsong);font-size:11px;letter-spacing:.14em;color:var(--ink-4);line-height:1}.wu{height:2px;background:var(--ink-1)}.hr{height:1px;background:var(--ink-1);margin-top:3px}</style></head><body>
