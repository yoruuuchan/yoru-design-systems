<!doctype html>
<!-- @dsCard group="Type" name="Type · mono + jp" subtitle="Geist Mono for logs · Zen Kaku for accents" viewport="700x260" --><html><head><meta charset="utf-8"><title>type mono & jp</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 18px 20px; }
  .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .card { padding: 14px 16px; border-radius: 14px; background: var(--bg-surface); box-shadow: var(--shadow-flat); }
  .eb { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
  .mono-line { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); line-height: 1.6; }
  .mono-line .k { color: var(--primary-600); }
  .mono-line .s { color: var(--success-700); }
  .mono-line .c { color: var(--ink-3); }
  .jp-display { font-family: var(--font-jp); font-size: 28px; font-weight: 500; color: var(--ink-1); line-height: 1.3; }
  .jp-sub { font-family: var(--font-jp); font-size: 14px; color: var(--ink-2); margin-top: 6px; }
  .jp-row { font-family: var(--font-jp); font-size: 13px; color: var(--ink-2); display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed var(--line-1); }
  .jp-row:last-child { border: none; }
  .jp-row .v { color: var(--ink-1); font-feature-settings: "tnum"; }
</style></head>
<body data-theme="akari">
  <div class="wrap">
    <div class="card">
      <div class="eb">Geist Mono · console output</div>
      <div class="mono-line"><span class="c">› provider</span> <span class="k">anthropic</span></div>
      <div class="mono-line"><span class="c">› model</span>    <span class="s">claude-sonnet-4-5</span></div>
      <div class="mono-line"><span class="c">› tokens</span>   1,284 / 200,000</div>
      <div class="mono-line"><span class="c">› latency</span>  412ms · ttft 180ms</div>
      <div class="mono-line"><span class="c">› cost</span>     $0.0046</div>
      <div class="mono-line" style="margin-top:6px"><span class="k">akari ◦</span> hi yoru, picking up where we left off.</div>
    </div>
    <div class="card">
      <div class="eb">Zen Kaku Gothic New · jp accent</div>
      <div class="jp-display">夜と灯</div>
      <div class="jp-sub">あなたの一日のリズムに寄り添う</div>
      <div style="margin-top:10px">
        <div class="jp-row"><span>記憶</span><span class="v">memory</span></div>
        <div class="jp-row"><span>世界観</span><span class="v">worldbook</span></div>
        <div class="jp-row"><span>提供元</span><span class="v">provider</span></div>
        <div class="jp-row"><span>安全</span><span class="v">safety</span></div>
      </div>
    </div>
  </div>
</body></html>
