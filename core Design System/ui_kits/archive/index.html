<head>

  <title>mostly_empty.com — core archive</title>
  <link rel="stylesheet" href="../../styles.css">
  <link rel="icon" href="../../assets/logo-mark.svg">
  <style>
    html, body { height: 100%; }
    body {
      margin: 0;
      background-color: var(--paper-grout);
      background-image: url("../../assets/tile.svg");
      background-size: 32px 32px;
      image-rendering: pixelated;
      font-family: var(--font-ui-sans);
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .desktop {
      min-height: 100vh;
      padding: 18px;
      display: grid;
      grid-template-columns: 220px 1fr 400px;
      grid-template-rows: auto 1fr;
      gap: 16px;
      box-sizing: border-box;
    }
    .marqwrap { grid-column: 1 / -1; }
    .gridwin {
      /* the file grid lives in its own window */
    }
    .top-row {
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 8px;
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      font-family: var(--font-pixel-display);
      font-size: 32px;

      text-shadow: 2px 2px 0 var(--paper-stained);
    }
    .brand img { width: 36px; height: 36px; }
    .crumb {
      font-family: var(--font-pixel-mono);
      font-size: 13px;
      color: var(--ink-soft);
      background: var(--paper);
      padding: 4px 8px;
      border: 1px solid var(--line);
      box-shadow: var(--bevel-in);
    }
    .floating-toast {
      position: fixed; right: 18px; bottom: 18px; z-index: 50;

    /* nightpool: the wallpaper stays, lights off (approved --tile-opacity) */
    [data-theme="nightpool"] body { background-image: none; }
    [data-theme="nightpool"] body::before {
      content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: url("../../assets/tile.svg"); background-size: 32px 32px;
      image-rendering: pixelated; opacity: var(--tile-opacity);
    }
    [data-theme="nightpool"] #root { position: relative; z-index: 1; }
  </style>

<body>

<script src="../../assets/vendor/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="../../assets/vendor/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="../../assets/vendor/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="./catalog.js"></script>

<script type="text/babel" src="./FileGrid.jsx"></script>
<script type="text/babel" src="./DetailView.jsx"></script>

<div id="root"></div>

<script type="text/babel">
  const { Window, Marquee, Toast, Button, OverexposedText } = window.CoreDesignSystem_61d596;

  function App() {
    const [activeCat, setActiveCat] = React.useState('all');
    const [selectedId, setSelectedId] = React.useState('pool_05');
    const [showToast, setShowToast] = React.useState(true);

    const selected = window.archiveCatalog.find(x => x.id === selectedId);
    const visible = window.archiveCatalog.filter(i => activeCat === 'all' || i.tag === activeCat);

    return (
      <div>
        <Marquee>
          welcome to mostly_empty.com ░░░ an archive of liminal places ░░░ last updated 06.23.2026 ░░░&nbsp;
        </Marquee>

        <div className="desktop">
          {/* top brand row */}
          <div style={{ gridColumn: '1 / -1', gridRow: '1' }}>
            <div className="top-row">
              <div className="brand">
                <img src="../../assets/logo-mark.svg" alt="" />
                mostly_empty.com
              </div>
              <div className="crumb">/archive/{activeCat}/ · {visible.length} item{visible.length===1?'':'s'}</div>
            </div>
          </div>

          {/* sidebar */}
          <div style={{ gridColumn: '1', gridRow: '2' }}>
            <window.ArchiveSidebar activeCat={activeCat} onPick={setActiveCat} />
          </div>

          {/* file grid window */}
          <div style={{ gridColumn: '2', gridRow: '2' }}>
            <Window
              title={`archive/${activeCat}/ — file_browser.exe`}
              size="lg"
              status={`[ ${visible.length} ] items · click thumbnail to open`}
              onMinimize={()=>{}}
            >
              <window.ArchiveFileGrid
                activeCat={activeCat}
                selectedId={selectedId}
                onSelect={setSelectedId}
              />
            </Window>
          </div>

          {/* detail */}
          <div style={{ gridColumn: '3', gridRow: '2', display:'flex', flexDirection:'column', gap:14 }}>
            <window.ArchiveDetail item={selected} onClose={()=>setSelectedId(null)} />
            <Window title="curator's note" bodyTone="dream" dense decorativeStripes={false}
                    style={{ width: 380 }}>
              <p style={{ fontFamily:'var(--font-body-serif)', fontSize:13, lineHeight:1.55, margin:0 }}>
                I keep this archive by hand. items are added when I find them. there is no search.
                if you are looking for something, you will have to wander.
              </p>
              <div style={{ marginTop: 8 }}>
                <Button size="sm" variant="ghost">about this site</Button>
              </div>
            </Window>
          </div>
        </div>

        {/* floating Y2K toast */}
        {showToast && (
          <div className="floating-toast">
            <Toast title="hello!" tone="dream" onClose={() => setShowToast(false)}>
              you are visitor <strong>00,141,082</strong>. signing the guestbook is encouraged.
            </Toast>
          </div>
        )}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<script>
/* core — nightpool theme toggle. ?theme=nightpool|default wins and persists
   to localStorage["core-theme"]; no param restores the saved choice. */
(function () {
  var KEY = 'core-theme';
  var root = document.documentElement;
  function apply(t) {
    if (t === 'nightpool') root.setAttribute('data-theme', 'nightpool');
    else root.removeAttribute('data-theme');
  }
  var q = new URLSearchParams(location.search).get('theme');
  if (q === 'nightpool' || q === 'default') {
    apply(q);
    try { localStorage.setItem(KEY, q); } catch (e) {}
  } else {
    var saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) {}
    if (saved === 'nightpool') apply('nightpool');
  }
  var btn = document.createElement('button');
  btn.type = 'button';
  function relabel() {
    btn.textContent = root.getAttribute('data-theme') === 'nightpool' ? 'default' : 'nightpool';
  }
  btn.style.cssText = 'position:fixed;right:12px;bottom:12px;z-index:9999;margin:0;padding:4px 10px;'
    + 'font:11px system-ui,sans-serif;text-transform:lowercase;cursor:pointer;border-radius:0;'
    + 'border:1px solid var(--line);background:var(--surface-card);color:var(--text-body);'
    + 'box-shadow:var(--bevel-out);';
  btn.addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'nightpool' ? 'default' : 'nightpool';
    apply(next);
    try { localStorage.setItem(KEY, next); } catch (e) {}
    relabel();
  });
  relabel();
  document.body.appendChild(btn);
})();
</script>
</body>
</html>
