<!-- @dsCard group="Blog" viewport="1200x900" name="blog · long-form" subtitle="serif body, sidebar, Y2K footer" -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>mostly_empty.com — blog</title>
  <link rel="stylesheet" href="../../styles.css">
  <link rel="icon" href="../../assets/logo-mark.svg">
  <style>
    body { margin: 0; background: var(--paper); color: var(--ink); }
    .page {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 0 0;
      position: relative;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 40px;
      padding: 32px 32px 0;
    }
    .main { min-width: 0; }
  </style>
</head>
<body>

<script src="../../assets/vendor/react.production.min.js" integrity="sha384-t63xaoqI4/tnZOZs58Xd/POzyY+r0ZlL3MZJsg5uEpKiDX6mJDAaS/KuesDjH55i" crossorigin="anonymous"></script>
<script src="../../assets/vendor/react-dom.production.min.js" integrity="sha384-8Y1L+f1y2tWRffeBSFDSl0M0VN4EevwrTLXRQyhfXCTukfuKEvApVoVps3phj/Vp" crossorigin="anonymous"></script>
<script src="../../assets/vendor/babel.min.js" integrity="sha384-nFyaaMobkrf0QCg1ByYephPUGWg8tPOUoVufojNocOA3oAhP+VvrN6x+m0JINhFn" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="./posts.js"></script>
<script type="text/babel" src="./BlogHeader.jsx"></script>
<script type="text/babel" src="./PostBody.jsx"></script>
<script type="text/babel" src="./BlogSidebar.jsx"></script>
<script type="text/babel" src="./BlogFooter.jsx"></script>

<div id="root"></div>

<script type="text/babel">
  function BlogApp() {
    const [postId, setPostId] = React.useState(window.blogPosts[0].id);
    const post = window.blogPosts.find(p => p.id === postId);
    React.useEffect(() => { window.scrollTo({ top: 0 }); }, [postId]);
    return (
      <div className="page">
        <window.BlogHeader activePostId={postId} onPick={setPostId} />
        <div className="layout">
          <div className="main">
            <window.BlogPostBody post={post} />
          </div>
          <window.BlogSidebar activePostId={postId} onPick={setPostId} />
        </div>
        <window.BlogFooter />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<BlogApp/>);
</script>

<script>
/* core — nightpool theme toggle. ?theme=nightpool|default wins and persists
   to localStorage["core-theme"]; no param restores the saved choice. */
(function () {
  var KEY = 'core-theme';
  var root = document.documentElement;
  function apply(t) {
    if (t === 'nightpool') root.setAttribute('data-theme', 'nightpool');
    else root.removeAttribute('data-theme');
  }
  var q = new URLSearchParams(location.search).get('theme');
  if (q === 'nightpool' || q === 'default') {
    apply(q);
    try { localStorage.setItem(KEY, q); } catch (e) {}
  } else {
    var saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) {}
    if (saved === 'nightpool') apply('nightpool');
  }
  var btn = document.createElement('button');
  btn.type = 'button';
  function relabel() {
    btn.textContent = root.getAttribute('data-theme') === 'nightpool' ? 'default' : 'nightpool';
  }
  btn.style.cssText = 'position:fixed;right:12px;bottom:12px;z-index:9999;margin:0;padding:4px 10px;'
    + 'font:11px system-ui,sans-serif;text-transform:lowercase;cursor:pointer;border-radius:0;'
    + 'border:1px solid var(--line);background:var(--surface-card);color:var(--text-body);'
    + 'box-shadow:var(--bevel-out);';
  btn.addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'nightpool' ? 'default' : 'nightpool';
    apply(next);
    try { localStorage.setItem(KEY, next); } catch (e) {}
    relabel();
  });
  relabel();
  document.body.appendChild(btn);
})();
</script>
</body>
</html>
