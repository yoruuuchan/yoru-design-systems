<!-- @dsCard group="Colors" viewport="700x110" name="Bondi scale" subtitle="Y2K hero blue — iMac/MSN/XP era · the new substrate accent" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px; background: var(--paper); }
  .row { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; }
  .sw { aspect-ratio: 1.4 / 1; display: flex; flex-direction: column; justify-content: flex-end;
        padding: 4px 6px; font-family: var(--font-ui-sans); font-size: 9px; color: var(--ink); }
  .sw.dark { color: var(--frost-50); }
  .sw small { display: block; font-family: var(--font-pixel-mono); opacity: 0.7; font-size: 10px; }
</style>
</head><body>
<div class="row">
  <div class="sw" style="background:var(--bondi-50)">50<small>e0f4fb</small></div>
  <div class="sw" style="background:var(--bondi-100)">100<small>bce8f6</small></div>
  <div class="sw" style="background:var(--bondi-200)">200<small>8ddaf0</small></div>
  <div class="sw" style="background:var(--bondi-300)">300<small>5fc8ea</small></div>
  <div class="sw" style="background:var(--bondi-400)">400<small>2eb2e0</small></div>
  <div class="sw dark" style="background:var(--bondi-500)">500<small>009de0</small></div>
  <div class="sw dark" style="background:var(--bondi-600)">600<small>0083bd</small></div>
  <div class="sw dark" style="background:var(--bondi-700)">700<small>006a99</small></div>
  <div class="sw dark" style="background:var(--bondi-800)">800<small>004d70</small></div>
  <div class="sw dark" style="background:var(--bondi-900)">900<small>003855</small></div>
</div>
</body></html>
