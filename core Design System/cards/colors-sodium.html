<!-- @dsCard group="Colors" viewport="700x110" name="Sodium scale" subtitle="backrooms yellow — demoted to warm accent · use sparingly against the cool substrate" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px; background: var(--paper); }
  .row { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; }
  .sw { aspect-ratio: 1.4 / 1; display: flex; flex-direction: column; justify-content: flex-end;
        padding: 4px 6px; font-family: var(--font-ui-sans); font-size: 9px; color: var(--ink); }
  .sw.dark { color: var(--paper); }
  .sw small { display: block; font-family: var(--font-pixel-mono); opacity: 0.7; font-size: 10px; }
</style>
</head><body>
<div class="row">
  <div class="sw" style="background:var(--sodium-50)">50<small>fbf3d8</small></div>
  <div class="sw" style="background:var(--sodium-100)">100<small>f5e4a8</small></div>
  <div class="sw" style="background:var(--sodium-200)">200<small>efd57e</small></div>
  <div class="sw" style="background:var(--sodium-300)">300<small>e8c761</small></div>
  <div class="sw" style="background:var(--sodium-400)">400<small>dcb13f</small></div>
  <div class="sw" style="background:var(--sodium-500)">500<small>d4a93a</small></div>
  <div class="sw dark" style="background:var(--sodium-600)">600<small>b88a23</small></div>
  <div class="sw dark" style="background:var(--sodium-700)">700<small>8a6b1e</small></div>
  <div class="sw dark" style="background:var(--sodium-800)">800<small>5c4815</small></div>
  <div class="sw dark" style="background:var(--sodium-900)">900<small>3d2e0c</small></div>
</div>
</body></html>
