<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px; background: var(--paper); color: var(--ink); }
  .row { display: flex; align-items: baseline; gap: 12px; margin-bottom: 2px; border-bottom: 1px dashed var(--paper-fold); padding: 4px 0; }
  .tag { font-family: var(--font-pixel-mono); font-size: 11px; color: var(--text-muted); width: 64px; flex: none; letter-spacing: 0.08em; }
  .spec { font-family: var(--font-pixel-display); }
  .body { font-family: var(--font-body-serif); }
  .ui { font-family: var(--font-ui-sans); }
</style>
</head><body>
<div class="row"><span class="tag">mega 144</span><span class="spec" style="font-size:60px;line-height:1">Aa</span></div>
<div class="row"><span class="tag">3xl 88</span><span class="spec" style="font-size:44px;line-height:1">Aa headline</span></div>
<div class="row"><span class="tag">2xl 56</span><span class="spec" style="font-size:32px;line-height:1">Aa section</span></div>
<div class="row"><span class="tag">xl 36</span><span class="spec" style="font-size:24px">Aa title</span></div>
<div class="row"><span class="tag">lg 24</span><span class="body" style="font-size:20px">Aa subtitle</span></div>
<div class="row"><span class="tag">md 18</span><span class="body" style="font-size:18px">Aa lead body</span></div>
<div class="row"><span class="tag">base 15</span><span class="body" style="font-size:15px">Aa default body text</span></div>
<div class="row"><span class="tag">sm 13</span><span class="body" style="font-size:13px">Aa secondary</span></div>
<div class="row"><span class="tag">xs 11</span><span class="ui" style="font-size:11px">Aa ui caption</span></div>
<div class="row"><span class="tag">xxs 10</span><span class="ui" style="font-size:10px">Aa chrome</span></div>
</body></html>
