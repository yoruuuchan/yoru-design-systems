<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px-grid · --space-1 through --space-32" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px; background: var(--paper); }
  .row { display: flex; align-items: flex-end; gap: 12px; }
  .block { display: flex; flex-direction: column; align-items: flex-start; }
  .swatch { background: var(--tile-500); box-shadow: var(--shadow-card); }
  .lab { font-family: var(--font-pixel-mono); font-size: 10px; color: var(--text-muted); margin-top: 4px; letter-spacing: 0.05em; }
</style>
</head><body>
<div class="row">
  <div class="block"><div class="swatch" style="width:4px;height:4px"></div><span class="lab">1·4</span></div>
  <div class="block"><div class="swatch" style="width:8px;height:8px"></div><span class="lab">2·8</span></div>
  <div class="block"><div class="swatch" style="width:12px;height:12px"></div><span class="lab">3·12</span></div>
  <div class="block"><div class="swatch" style="width:16px;height:16px"></div><span class="lab">4·16</span></div>
  <div class="block"><div class="swatch" style="width:24px;height:24px"></div><span class="lab">6·24</span></div>
  <div class="block"><div class="swatch" style="width:32px;height:32px"></div><span class="lab">8·32</span></div>
  <div class="block"><div class="swatch" style="width:48px;height:48px"></div><span class="lab">12·48</span></div>
  <div class="block"><div class="swatch" style="width:64px;height:64px"></div><span class="lab">16·64</span></div>
  <div class="block"><div class="swatch" style="width:96px;height:96px"></div><span class="lab">24·96</span></div>
</div>
</body></html>
