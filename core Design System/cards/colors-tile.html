<!-- @dsCard group="Colors" viewport="700x110" name="Tile scale" subtitle="chlorine pool blue — the cool contrast" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px; background: var(--paper); }
  .row { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; }
  .sw { aspect-ratio: 1.4 / 1; display: flex; flex-direction: column; justify-content: flex-end;
        padding: 4px 6px; font-family: var(--font-ui-sans); font-size: 9px; color: var(--ink); }
  .sw.dark { color: var(--paper); }
  .sw small { display: block; font-family: var(--font-pixel-mono); opacity: 0.7; font-size: 10px; }
</style>
</head><body>
<div class="row">
  <div class="sw" style="background:var(--tile-50)">50<small>eef5f8</small></div>
  <div class="sw" style="background:var(--tile-100)">100<small>d3e6ed</small></div>
  <div class="sw" style="background:var(--tile-200)">200<small>b1d4df</small></div>
  <div class="sw" style="background:var(--tile-300)">300<small>8fc0d2</small></div>
  <div class="sw" style="background:var(--tile-400)">400<small>6aa9bf</small></div>
  <div class="sw dark" style="background:var(--tile-500)">500<small>4a8fa8</small></div>
  <div class="sw dark" style="background:var(--tile-600)">600<small>356f87</small></div>
  <div class="sw dark" style="background:var(--tile-700)">700<small>244f63</small></div>
  <div class="sw dark" style="background:var(--tile-800)">800<small>163546</small></div>
  <div class="sw dark" style="background:var(--tile-900)">900<small>0c2230</small></div>
</div>
</body></html>
