<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">

</head><body>
<div class="col"><img class="wm" src="../assets/logo.svg" alt="core"><div class="lab">assets/logo.svg</div></div>
<div class="col"><img class="mark" src="../assets/logo-mark.svg" alt="core mark"><div class="lab">assets/logo-mark.svg</div></div>
