<!-- @dsCard group="Colors" viewport="700x110" name="Chrome scale" subtitle="millennial silver / brushed metal" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px; background: var(--paper); }
  .row { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; }
  .sw { aspect-ratio: 1.4 / 1; display: flex; flex-direction: column; justify-content: flex-end;
        padding: 4px 6px; font-family: var(--font-ui-sans); font-size: 9px; color: var(--ink); }
  .sw.dark { color: var(--frost-50); }
  .sw small { display: block; font-family: var(--font-pixel-mono); opacity: 0.7; font-size: 10px; }
</style>
</head><body>
<div class="row">
  <div class="sw" style="background:var(--chrome-50)">50<small>f0f4f8</small></div>
  <div class="sw" style="background:var(--chrome-100)">100<small>dde4ec</small></div>
  <div class="sw" style="background:var(--chrome-200)">200<small>c8d2dd</small></div>
  <div class="sw" style="background:var(--chrome-300)">300<small>b4c0cc</small></div>
  <div class="sw" style="background:var(--chrome-400)">400<small>97a4b3</small></div>
  <div class="sw" style="background:var(--chrome-500)">500<small>8895a3</small></div>
  <div class="sw dark" style="background:var(--chrome-600)">600<small>6c7886</small></div>
  <div class="sw dark" style="background:var(--chrome-700)">700<small>4a5663</small></div>
  <div class="sw dark" style="background:var(--chrome-800)">800<small>2d3744</small></div>
  <div class="sw dark" style="background:var(--chrome-900)">900<small>1d2733</small></div>
</div>
</body></html>
