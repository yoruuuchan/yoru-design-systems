<!-- @dsCard group="Colors" viewport="700x140" name="Ink + paper" subtitle="cool inks and frost paper — never #000 or #fff" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px; background: var(--paper); }
  .row { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; }
  .sw { aspect-ratio: 1.4 / 1; display: flex; flex-direction: column; justify-content: flex-end;
        padding: 4px 6px; font-family: var(--font-ui-sans); font-size: 9px; color: var(--ink);
        border: 1px solid rgba(12,26,38,0.15); }
  .sw.dark { color: var(--frost-50); border-color: transparent; }
  .sw small { display: block; font-family: var(--font-pixel-mono); opacity: 0.7; font-size: 10px; }
  .label { font-family: var(--font-pixel-mono); font-size: 10px; color: var(--text-muted);
           padding: 0 4px 6px; letter-spacing: 0.08em; text-transform: uppercase; }
</style>
</head><body>
<div class="label">paper · cool frost</div>
<div class="row">
  <div class="sw" style="background:var(--paper)">paper<small>eaf4f8</small></div>
  <div class="sw" style="background:var(--paper-stained)">stained<small>d8e7ef</small></div>
  <div class="sw" style="background:var(--paper-grout)">grout<small>bcd3df</small></div>
  <div class="sw" style="background:var(--paper-fold)">fold<small>95b3c4</small></div>
  <div class="sw dark" style="background:var(--ink-faint)">faint<small>7a8c9e</small></div>
  <div class="sw dark" style="background:var(--ink-muted)">muted<small>4a5e72</small></div>
  <div class="sw dark" style="background:var(--ink-soft)">soft<small>1a2f42</small></div>
  <div class="sw dark" style="background:var(--ink)">ink<small>0c1a26</small></div>
</div>
</body></html>
