<!-- @dsCard group="Brand" viewport="700x200" name="Tile textures" subtitle="--bg-tile-pattern (cool) + warm variant + caustic pool" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px; background: var(--paper); display: flex; gap: 12px; font-family: var(--font-ui-sans); font-size: 11px; }
  .tex { flex: 1; height: 150px; border: 1px solid var(--ink); position: relative; background-size: 64px 64px; image-rendering: pixelated; }
  .t1 { background-image: var(--bg-tile-pattern); }
  .t2 { background-image: url("../assets/tile-warm.svg"); }
  .t3 { background-image: var(--bg-caustic-pattern); background-size: 200px 200px; }
  .lab { position: absolute; left: 8px; bottom: 8px; font-family: var(--font-pixel-mono); font-size: 10px; color: var(--ink); background: rgba(246,239,217,0.85); padding: 2px 6px; }
</style>
</head><body>
<div class="tex t1"><span class="lab">tile.svg (cool)</span></div>
<div class="tex t2"><span class="lab">tile-warm.svg</span></div>
<div class="tex t3"><span class="lab">caustic.svg</span></div>
</body></html>
