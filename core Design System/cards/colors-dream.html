<!-- @dsCard group="Colors" viewport="700x120" name="Dream halos" subtitle="peach + rose — secondary warm accent, paired against bondi" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px; background: var(--paper); }
  .row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .sw { aspect-ratio: 1.5 / 1; display: flex; flex-direction: column; justify-content: flex-end;
        padding: 4px 6px; font-family: var(--font-ui-sans); font-size: 9px; color: var(--ink); }
  .sw small { display: block; font-family: var(--font-pixel-mono); opacity: 0.7; font-size: 10px; }
  .label { font-family: var(--font-pixel-mono); font-size: 10px; color: var(--text-muted);
           padding: 0 4px 4px; letter-spacing: 0.08em; text-transform: uppercase; }
</style>
</head><body>
<div class="label">peach</div>
<div class="row">
  <div class="sw" style="background:var(--peach-100)">100<small>fce5d8</small></div>
  <div class="sw" style="background:var(--peach-200)">200<small>f7cdb8</small></div>
  <div class="sw" style="background:var(--peach-300)">300<small>f4b8a0</small></div>
  <div class="sw" style="background:var(--peach-400)">400<small>ee9b7d</small></div>
  <div class="sw" style="background:var(--peach-500)">500<small>e88a6e</small></div>
  <div class="sw" style="background:var(--rose-300)">rose-300<small>f0a4b8</small></div>
  <div class="sw" style="background:var(--rose-400)">rose-400<small>e57f9b</small></div>
</div>
</body></html>
