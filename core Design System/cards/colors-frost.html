<!-- @dsCard group="Colors" viewport="700x110" name="Frost scale" subtitle="icy paper substrate — the new --paper-*" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px; background: var(--ink); }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
  .sw { aspect-ratio: 1.8 / 1; display: flex; flex-direction: column; justify-content: flex-end;
        padding: 6px 10px; font-family: var(--font-ui-sans); font-size: 10px; color: var(--ink); }
  .sw small { display: block; font-family: var(--font-pixel-mono); opacity: 0.7; font-size: 10px; }
</style>
</head><body>
<div class="row">
  <div class="sw" style="background:var(--frost-50)">50<small>f5fafd</small></div>
  <div class="sw" style="background:var(--frost-100)">100 · paper<small>eaf4f8</small></div>
  <div class="sw" style="background:var(--frost-200)">200 · stained<small>d8e7ef</small></div>
  <div class="sw" style="background:var(--frost-300)">300 · grout<small>bcd3df</small></div>
  <div class="sw" style="background:var(--frost-400)">400 · fold<small>95b3c4</small></div>
</div>
</body></html>
