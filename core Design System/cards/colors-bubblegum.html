<!-- @dsCard group="Colors" viewport="700x110" name="Bubblegum scale" subtitle="Y2K pink — Lisa Frank accent · the only warm-counterpart to bondi" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px; background: var(--paper); }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
  .sw { aspect-ratio: 1.8 / 1; display: flex; flex-direction: column; justify-content: flex-end;
        padding: 6px 10px; font-family: var(--font-ui-sans); font-size: 10px; color: var(--ink); }
  .sw.dark { color: var(--frost-50); }
  .sw small { display: block; font-family: var(--font-pixel-mono); opacity: 0.7; font-size: 10px; }
</style>
</head><body>
<div class="row">
  <div class="sw" style="background:var(--bubblegum-200)">200<small>ffd6e8</small></div>
  <div class="sw" style="background:var(--bubblegum-300)">300<small>ffafd0</small></div>
  <div class="sw" style="background:var(--bubblegum-400)">400<small>ff92bf</small></div>
  <div class="sw" style="background:var(--bubblegum-500)">500<small>ff7eb6</small></div>
  <div class="sw dark" style="background:var(--bubblegum-700)">700<small>c84f8e</small></div>
</div>
</body></html>
