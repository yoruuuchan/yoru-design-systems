<!-- @dsCard group="Slides" viewport="1280x720" name="title slide" subtitle="hero opener with logo, marquee, overexposed title" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;height:100%}
  .slide{
    width:1280px; height:720px; position:relative; overflow:hidden;
    background-color: var(--paper-grout);
    background-image: url("../assets/tile.svg");
    background-size: 64px 64px;
    image-rendering: pixelated;
    display:flex; flex-direction:column;
  }
  .grain{position:absolute;inset:0;background-image:url("../assets/grain.svg");
         background-size:300px 300px;opacity:var(--grain-opacity,.18);mix-blend-mode:multiply;pointer-events:none}
  [data-theme="nightpool"] .grain{mix-blend-mode:normal}
  .marq{
    background:var(--abyss-950, var(--ink)); color:var(--phosphor-200, var(--paper));
    padding:6px 0; white-space:nowrap; overflow:hidden;
    font-family: var(--font-pixel-display); font-size: 28px;
    letter-spacing: .08em;
    border-bottom: 1px solid var(--line);
  }
  .core { padding: 84px 96px 0; display:flex; align-items:flex-start; gap: 40px; }
  .logo { width: 96px; height: 96px; flex:none; box-shadow: var(--glow-bondi); }
  .titles { flex:1; min-width:0; }
  .kicker {
    display:inline-block;
    font-family: var(--font-pixel-mono); font-size: 18px; color: var(--abyss-950, var(--ink));
    background: var(--bubblegum-300); padding: 4px 14px;
    border: 1px solid var(--line); letter-spacing: 0.1em; text-transform: uppercase;
    box-shadow: var(--shadow-card);
  }
  h1 {
    font-family: var(--font-pixel-display); font-weight: 400;
    font-size: 200px; line-height: .9; letter-spacing: -0.02em;
    margin: 18px 0 0;
    color: var(--frost-50);
    text-shadow:
      0 0 12px var(--frost-50), 0 0 24px var(--bondi-200),
      0 0 56px var(--bondi-300), 0 0 96px var(--bubblegum-300),
      4px 4px 0 var(--abyss-950, var(--ink));
  }
  .sub {
    margin-top: 12px;
    font-family: var(--font-body-serif); font-size: 28px; font-style: italic;
    color: var(--ink-soft);
  }
  .meta {
    position:absolute; left:96px; bottom:48px; right:96px;
    display:flex; justify-content:space-between; align-items:flex-end;
    font-family: var(--font-pixel-mono); font-size: 14px; color: var(--ink);
    letter-spacing: 0.06em;
  }
  .meta .stamp {
    border: 1px solid var(--line); padding: 4px 10px; background: var(--paper);
    box-shadow: var(--bevel-out);
  }
  /* nightpool: the wallpaper stays, lights off (approved --tile-opacity) */
  [data-theme="nightpool"] .slide { background-image: none; }
  [data-theme="nightpool"] .slide::before {
    content:""; position:absolute; inset:0; z-index:0; pointer-events:none;
    background-image: url("../assets/tile.svg"); background-size: 64px 64px;
    image-rendering: pixelated; opacity: var(--tile-opacity);
  }
  /* only the static children need lifting above the wallpaper layer —
     .meta / .grain are already positioned and stack on their own */
  [data-theme="nightpool"] .slide > .marq,
  [data-theme="nightpool"] .slide > .core { position: relative; z-index: 1; }
</style></head>
<body>
<div class="slide">
  <div class="marq">
    welcome ░ welcome ░ welcome ░ welcome ░ welcome ░ welcome ░ welcome ░ welcome ░
  </div>
  <div class="core">
    <img src="../assets/logo-mark.svg" class="logo" alt="">
    <div class="titles">
      <span class="kicker">a talk · 06.23.2026</span>
      <h1>mostly empty.</h1>
      <div class="sub">on liminal places, and the people who keep their records.</div>
    </div>
  </div>
  <div class="meta">
    <span class="stamp">curated by hand since 1999</span>
    <span class="stamp">core/</span>
  </div>
  <div class="grain"></div>
</div>
<script>
/* core — nightpool theme toggle. ?theme=nightpool|default wins and persists
   to localStorage["core-theme"]; no param restores the saved choice. */
(function () {
  var KEY = 'core-theme';
  var root = document.documentElement;
  function apply(t) {
    if (t === 'nightpool') root.setAttribute('data-theme', 'nightpool');
    else root.removeAttribute('data-theme');
  }
  var q = new URLSearchParams(location.search).get('theme');
  if (q === 'nightpool' || q === 'default') {
    apply(q);
    try { localStorage.setItem(KEY, q); } catch (e) {}
  } else {
    var saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) {}
    if (saved === 'nightpool') apply('nightpool');
  }
  var btn = document.createElement('button');
  btn.type = 'button';
  function relabel() {
    btn.textContent = root.getAttribute('data-theme') === 'nightpool' ? 'default' : 'nightpool';
  }
  btn.style.cssText = 'position:fixed;right:12px;bottom:12px;z-index:9999;margin:0;padding:4px 10px;'
    + 'font:11px system-ui,sans-serif;text-transform:lowercase;cursor:pointer;border-radius:0;'
    + 'border:1px solid var(--line);background:var(--surface-card);color:var(--text-body);'
    + 'box-shadow:var(--bevel-out);';
  btn.addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'nightpool' ? 'default' : 'nightpool';
    apply(next);
    try { localStorage.setItem(KEY, next); } catch (e) {}
    relabel();
  });
  relabel();
  document.body.appendChild(btn);
})();
</script>
</body></html>
