<!-- @dsCard group="Slides" viewport="1280x720" name="end slide" subtitle="closing — pixel 'fin' + web-ring footer" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;height:100%}
  .slide{
    width:1280px; height:720px; position:relative; overflow:hidden;
    background: var(--abyss-950, var(--ink));
    color: var(--phosphor-200, var(--paper));
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
  }
  .slide::before{
    content:""; position:absolute; inset:0;
    background-image: url("../assets/tile.svg");
    background-size: 64px 64px;
    image-rendering: pixelated;
    opacity: var(--tile-opacity, .2); mix-blend-mode: screen;
  }
  .fin {
    font-family: var(--font-pixel-display); font-size: 320px; line-height: 1;
    color: var(--frost-50);
    text-shadow:
      0 0 24px var(--bondi-300), 0 0 64px var(--bondi-500),
      0 0 120px rgba(95,200,234,.55);
    letter-spacing: -0.02em;
    position: relative;
  }
  .url {
    margin-top: 20px;
    font-family: var(--font-pixel-mono); font-size: 24px;
    color: var(--phosphor-200, var(--paper)); letter-spacing: 0.18em;
    position: relative;
  }
  .marq {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: var(--paper); color: var(--ink);
    padding: 8px 0; font-family: var(--font-pixel-display); font-size: 24px;
    overflow: hidden; white-space: nowrap;
    border-top: 1px solid var(--line);
    letter-spacing: 0.08em;
  }
  .grain{position:absolute;inset:0;background-image:url("../assets/grain.svg");
         background-size:300px 300px;opacity:var(--grain-opacity,.22);mix-blend-mode:overlay;pointer-events:none}
  [data-theme="nightpool"] .grain{mix-blend-mode:normal}
  .ring {
    position: absolute; left: 40px; top: 40px;
    display: flex; gap: 8px;
    font-family: var(--font-pixel-mono); font-size: 14px;
    color: var(--phosphor-400, var(--paper-fold));
  }
  .ring a { color: var(--neon-cyan); border-bottom: 1px dashed; padding-bottom: 1px; text-decoration: none; }
</style></head>
<body>
<div class="slide">
  <div class="ring">
    <a href="#">« drain_records</a>
    <span>·</span>
    <a href="#" style="color:var(--neon-lime)">random</a>
    <span>·</span>
    <a href="#" style="color:var(--neon-magenta)">hum_archive »</a>
  </div>
  <div class="fin">fin.</div>
  <div class="url">mostly_empty.com / guestbook ░</div>
  <div class="grain"></div>
  <div class="marq">thanks for staying ░ thanks for staying ░ thanks for staying ░ thanks for staying ░ thanks for staying ░</div>
</div>
<script>
/* core — nightpool theme toggle. ?theme=nightpool|default wins and persists
   to localStorage["core-theme"]; no param restores the saved choice. */
(function () {
  var KEY = 'core-theme';
  var root = document.documentElement;
  function apply(t) {
    if (t === 'nightpool') root.setAttribute('data-theme', 'nightpool');
    else root.removeAttribute('data-theme');
  }
  var q = new URLSearchParams(location.search).get('theme');
  if (q === 'nightpool' || q === 'default') {
    apply(q);
    try { localStorage.setItem(KEY, q); } catch (e) {}
  } else {
    var saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) {}
    if (saved === 'nightpool') apply('nightpool');
  }
  var btn = document.createElement('button');
  btn.type = 'button';
  function relabel() {
    btn.textContent = root.getAttribute('data-theme') === 'nightpool' ? 'default' : 'nightpool';
  }
  btn.style.cssText = 'position:fixed;right:12px;bottom:12px;z-index:9999;margin:0;padding:4px 10px;'
    + 'font:11px system-ui,sans-serif;text-transform:lowercase;cursor:pointer;border-radius:0;'
    + 'border:1px solid var(--line);background:var(--surface-card);color:var(--text-body);'
    + 'box-shadow:var(--bevel-out);';
  btn.addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'nightpool' ? 'default' : 'nightpool';
    apply(next);
    try { localStorage.setItem(KEY, next); } catch (e) {}
    relabel();
  });
  relabel();
  document.body.appendChild(btn);
})();
</script>
</body></html>
