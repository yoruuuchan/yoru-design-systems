<!-- @dsCard group="Surfaces" viewport="700x230" name="滚花 Knurl &amp; radii" subtitle="1px teeth at 5px pitch, from lens focus rings. Progress detents onto whole teeth." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);font-family:var(--font-core);color:var(--ink);-webkit-font-smoothing:antialiased}</style></head><body><div style="padding:26px 32px;display:flex;flex-direction:column;gap:20px">
<div style="display:flex;align-items:center;gap:14px"><div class="k-knurl" style="flex:1"></div><span class="k-data-tick" style="font-size:12px">divider · 齿距 5px</span></div>
<div style="display:flex;align-items:center;gap:14px"><div style="flex:1;height:6px;position:relative" id="kp"><div class="k-knurl" style="position:absolute;inset:0"></div><div class="k-knurl" id="kf" style="position:absolute;left:0;top:0;bottom:0;color:var(--accent)"></div><div id="kd" style="position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--accent)"></div></div><span class="k-data-tick" style="font-size:12px">progress 62% → 咔到齿位</span></div>
<div style="display:flex;gap:14px;align-items:center">
<div class="k-control" style="border-radius:10px;padding:9px 20px;font-size:14px;font-weight:500">card 10</div><div class="k-control" style="border-radius:8px;padding:9px 20px;font-size:14px;font-weight:500">control 8</div><div class="k-control" style="border-radius:6px;padding:9px 20px;font-size:14px;font-weight:500">chip 6</div>
<div class="k-control" style="border-radius:999px;padding:9px 20px;font-size:14px;font-weight:500">pill 999</div>
<span style="flex:1"></span><span class="k-caption" style="font-size:13px;color:var(--ink-faint)">台板，不是枕头</span></div>
</div></body></html>
