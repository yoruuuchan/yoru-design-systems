<!-- @dsCard group="Colors" viewport="700x270" name="银 Gin — silver anodized (default)" subtitle="The ground is metal, never #FFFFFF" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);font-family:var(--font-core);color:var(--ink);-webkit-font-smoothing:antialiased}</style></head><body><div style="padding:24px 32px;display:flex;flex-direction:column;gap:18px">
<div style="display:flex;gap:10px"><div style="flex:1"><div style="height:64px;background:var(--surface-well);border:1px solid var(--line);border-radius:6px"></div><div class="k-data-tick" style="font-size:11px;margin-top:7px;">well #DDE0E3</div></div><div style="flex:1"><div style="height:64px;background:var(--bg);border:1px solid var(--line);border-radius:6px"></div><div class="k-data-tick" style="font-size:11px;margin-top:7px;">bg #E7E9EB</div></div><div style="flex:1"><div style="height:64px;background:var(--surface-plate);border:1px solid var(--line);border-radius:6px"></div><div class="k-data-tick" style="font-size:11px;margin-top:7px;">plate #EDEFF1</div></div><div style="flex:1"><div style="height:64px;background:var(--surface-card);border:1px solid var(--line);border-radius:6px"></div><div class="k-data-tick" style="font-size:11px;margin-top:7px;">card #F4F5F6</div></div><div style="flex:1"><div style="height:64px;background:var(--surface-control);border:1px solid var(--line);border-radius:6px"></div><div class="k-data-tick" style="font-size:11px;margin-top:7px;">control #FAFBFB</div></div></div>
<div style="display:flex;gap:10px"><div style="flex:1"><div style="height:64px;background:var(--ink);border:1px solid var(--line);border-radius:6px"></div><div class="k-data-tick" style="font-size:11px;margin-top:7px;">ink #16191C</div></div><div style="flex:1"><div style="height:64px;background:var(--ink-muted);border:1px solid var(--line);border-radius:6px"></div><div class="k-data-tick" style="font-size:11px;margin-top:7px;">muted #5A636B</div></div><div style="flex:1"><div style="height:64px;background:var(--ink-faint);border:1px solid var(--line);border-radius:6px"></div><div class="k-data-tick" style="font-size:11px;margin-top:7px;">faint #8D969D</div></div><div style="flex:1"><div style="height:64px;background:var(--line);border:1px solid var(--line);border-radius:6px"></div><div class="k-data-tick" style="font-size:11px;margin-top:7px;">line #C8CDD1</div></div><div style="flex:1"><div style="height:64px;background:var(--accent);border:1px solid var(--line);border-radius:6px"></div><div class="k-data-tick" style="font-size:11px;margin-top:7px;">accent #2B4C6F</div></div></div>
</div></body></html>
