<!-- @dsCard group="Type" viewport="700x210" name="字宽网格 Character grid" subtitle="Typewriter effect: fixed 1em grid + whole-character fade, no monospace dependency" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);font-family:var(--font-core);color:var(--ink);-webkit-font-smoothing:antialiased}</style></head><body><div style="padding:30px 32px;display:flex;flex-direction:column;gap:16px">
<div style="display:flex">
<div style="width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:500;border:1px dashed var(--line);margin-left:-1px;opacity:1">布</div><div style="width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:500;border:1px dashed var(--line);margin-left:-1px;opacity:1">局</div><div style="width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:500;border:1px dashed var(--line);margin-left:-1px;opacity:1">第</div><div style="width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:500;border:1px dashed var(--line);margin-left:-1px;opacity:1">零</div><div style="width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:500;border:1px dashed var(--line);margin-left:-1px;opacity:1">帧</div><div style="width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:500;border:1px dashed var(--line);margin-left:-1px;opacity:0.45">排</div><div style="width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:500;border:1px dashed var(--line);margin-left:-1px;opacity:0.12">好</div>
<div style="width:52px;height:52px;border:1px dashed var(--line);margin-left:-1px;display:flex;align-items:center;justify-content:center"><div style="width:3px;height:30px;background:var(--accent)"></div></div>
</div>
<div class="k-data-tick" style="font-size:13px">每格 1em · 整字淡入 8f · 光标不因字宽抖动 · 4–5 字/秒</div>
</div></body></html>
