<!-- @dsCard group="Colors" viewport="700x270" name="玄 Kuro — black anodized" subtitle="The dark palette; same material, inverted light" -->
<!DOCTYPE html><html data-k-theme="kuro"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);font-family:var(--font-core);color:var(--ink);-webkit-font-smoothing:antialiased}</style></head><body><div style="padding:24px 32px;display:flex;flex-direction:column;gap:18px">
<div style="display:flex;gap:10px"><div style="flex:1"><div style="height:64px;background:var(--surface-well);border:1px solid var(--line);border-radius:6px"></div><div class="k-data-tick" style="font-size:11px;margin-top:7px;">well #0B0E10</div></div><div style="flex:1"><div style="height:64px;background:var(--bg);border:1px solid var(--line);border-radius:6px"></div><div class="k-data-tick" style="font-size:11px;margin-top:7px;">bg #111417</div></div><div style="flex:1"><div style="height:64px;background:var(--surface-plate);border:1px solid var(--line);border-radius:6px"></div><div class="k-data-tick" style="font-size:11px;margin-top:7px;">plate #171B1E</div></div><div style="flex:1"><div style="height:64px;background:var(--surface-card);border:1px solid var(--line);border-radius:6px"></div><div class="k-data-tick" style="font-size:11px;margin-top:7px;">card #1D2226</div></div><div style="flex:1"><div style="height:64px;background:var(--surface-control);border:1px solid var(--line);border-radius:6px"></div><div class="k-data-tick" style="font-size:11px;margin-top:7px;">control #262C30</div></div></div>
<div style="display:flex;gap:10px"><div style="flex:1"><div style="height:64px;background:var(--ink);border:1px solid var(--line);border-radius:6px"></div><div class="k-data-tick" style="font-size:11px;margin-top:7px;">ink #E8EBED</div></div><div style="flex:1"><div style="height:64px;background:var(--ink-muted);border:1px solid var(--line);border-radius:6px"></div><div class="k-data-tick" style="font-size:11px;margin-top:7px;">muted #9AA4AB</div></div><div style="flex:1"><div style="height:64px;background:var(--ink-faint);border:1px solid var(--line);border-radius:6px"></div><div class="k-data-tick" style="font-size:11px;margin-top:7px;">faint #5F6970</div></div><div style="flex:1"><div style="height:64px;background:var(--line);border:1px solid var(--line);border-radius:6px"></div><div class="k-data-tick" style="font-size:11px;margin-top:7px;">line #2C3339</div></div><div style="flex:1"><div style="height:64px;background:var(--accent);border:1px solid var(--line);border-radius:6px"></div><div class="k-data-tick" style="font-size:11px;margin-top:7px;">accent #7BA3CC</div></div></div>
</div></body></html>
