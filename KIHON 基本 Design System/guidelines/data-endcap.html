<!-- @dsCard group="Surfaces" viewport="700x220" name="数据端面 Bar end cap" subtitle="Milled cut face + extruded side walls, tuned per ramp step so depth reads evenly" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);font-family:var(--font-core);color:var(--ink)}</style></head><body>
<div style="padding:24px 30px;display:flex;gap:34px;align-items:center">
<div style="display:flex;align-items:flex-end;gap:14px;height:132px">
<div style="width:46px;height:38%;background:var(--ramp-1);border-radius:4px 4px 0 0;box-shadow:var(--bar-cap-up-1)"></div>
<div style="width:46px;height:58%;background:var(--ramp-2);border-radius:4px 4px 0 0;box-shadow:var(--bar-cap-up-2)"></div>
<div style="width:46px;height:78%;background:var(--ramp-3);border-radius:4px 4px 0 0;box-shadow:var(--bar-cap-up-3)"></div>
<div style="width:46px;height:100%;background:var(--ramp-4);border-radius:4px 4px 0 0;box-shadow:var(--bar-cap-up-4)"></div>
</div>
<div style="flex:1;display:flex;flex-direction:column;gap:11px">
<div style="width:78%;height:30px;background:var(--ramp-3);border-radius:0 4px 4px 0;box-shadow:var(--bar-cap-right-3)"></div>
<div style="width:52%;height:30px;background:var(--ramp-2);border-radius:0 4px 4px 0;box-shadow:var(--bar-cap-right-2)"></div>
<div style="display:flex;gap:16px;margin-top:4px">
<span class="k-micro" style="--u:.62">2px 切削面 + 1px 肩线 · 生长的那一头</span>
<span class="k-micro" style="--u:.62">按色阶补偿：浅柱靠肩线，深柱靠高光</span>
</div>
</div>
</div></body></html>
