<!-- @dsCard group="Colors" viewport="700x250" name="烤蓝 Accent = state" subtitle="Selected · active · AFTER · go — never encodes data, never decorates" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);font-family:var(--font-core);color:var(--ink);-webkit-font-smoothing:antialiased}</style></head><body><div style="padding:24px 32px;display:flex;flex-direction:column;gap:18px">
<div style="display:flex;gap:12px;align-items:center">
<span style="display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border:1px solid var(--accent);color:var(--accent);border-radius:6px;font-size:15px;font-weight:500;background:var(--accent-soft)">✓ AFTER</span>
<span style="display:inline-flex;align-items:center;gap:8px;padding:8px 16px;background:var(--accent);color:var(--accent-ink);border-radius:6px;font-size:15px;font-weight:500">已选中</span>
<span style="display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border:1px solid var(--line);color:var(--ink-muted);border-radius:6px;font-size:15px">未选</span>
<span style="display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border:1px solid var(--line);color:var(--negative);border-radius:6px;font-size:15px">✗ BEFORE</span>
<span style="flex:1"></span><span class="k-data-tick" style="font-size:12px;color:var(--accent)">#2B4C6F</span></div>
<div style="display:flex;gap:10px;align-items:center"><span style="color:var(--positive);font-size:15px">✓</span><span class="k-caption" style="font-size:15px">positive 有意等于 accent：亮起的仪表灯即就绪</span><span style="width:20px"></span><span style="color:var(--negative);font-size:15px">✗</span><span class="k-caption" style="font-size:15px">negative 氧化红 #A6402F，只用于否定，不用于强调</span></div>
</div></body></html>
