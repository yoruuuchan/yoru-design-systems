<!-- @dsCard group="9:16 Frames" viewport="640x700" name="Portrait kit 9:16" subtitle="The same content as native 1080×1920 layouts — never a reflow" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>KIHON 9:16 frames</title><link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../shared/kit-motion.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
body{margin:0;background:var(--bg);font-family:var(--font-core);color:var(--ink)}
.kit-btn{cursor:pointer;border:none;background:none;padding:0;font:inherit;text-align:left}
.kit-btn:hover>span{background:var(--grad-control)}
</style></head><body><div id="root"></div>
<script type="text/babel" src="../shared/kit-motion.jsx"></script>
<script type="text/babel" src="TitleFrameP.jsx"></script>
<script type="text/babel" src="DataFrameP.jsx"></script>
<script type="text/babel" src="CompareFrameP.jsx"></script>
<script type="text/babel" src="StepFrameP.jsx"></script>
<script type="text/babel">
const {Chip,Numeral}=window.KIHONDesignSystem_bc9292;
const FRAMES=()=>[['标题 Title',window.TitleFrameP],['数据 Data',window.DataFrameP],['前后 Compare',window.CompareFrameP],['步骤 Steps',window.StepFrameP]];
function App(){
  const [i,setI]=React.useState(0);
  const [theme,setTheme]=React.useState('gin');
  const [k,setK]=React.useState(0);
  const Frame=FRAMES()[i][1];
  return (
    <div style={{padding:'16px',display:'flex',gap:'14px',justifyContent:'center'}}>
      <div data-screen-label={FRAMES()[i][0]} className="k-plate" style={{padding:'10px',width:'386px',flex:'none'}}>
        <Frame key={i+'-'+theme+'-'+k} theme={theme}/>
      </div>
      <div className="k-plate" style={{display:'flex',flexDirection:'column',gap:'12px',padding:'16px','--u':.48,alignSelf:'flex-start'}}>
        {FRAMES().map((f,j)=>(
          <button key={f[0]} className="kit-btn" onClick={()=>setI(j)}><Chip state={i===j?'selected':'neutral'}>{f[0]}</Chip></button>
        ))}
        <div style={{height:'1px',background:'var(--line)',margin:'6px 0'}}></div>
        <div style={{display:'flex',gap:'8px'}}>
          <button className="kit-btn" onClick={()=>setTheme('gin')}><Chip state={theme==='gin'?'selected':'neutral'}>银</Chip></button>
          <button className="kit-btn" onClick={()=>setTheme('kuro')}><Chip state={theme==='kuro'?'selected':'neutral'}>玄</Chip></button>
        </div>
        <button className="kit-btn" onClick={()=>setK(k+1)}><Chip state="active">⟳ 重播</Chip></button>
        <div style={{marginTop:'8px'}}><Numeral tick value="u = w/1080" style={{'--u':.42}}/></div>
      </div>
    </div>
  );
}

let tries=0;
function mount(){
  const ready=window.TitleFrameP&&window.DataFrameP&&window.CompareFrameP&&window.StepFrameP;
  if(!ready&&tries++<60){return setTimeout(mount,50);}
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
}
mount();
</script></body></html>
