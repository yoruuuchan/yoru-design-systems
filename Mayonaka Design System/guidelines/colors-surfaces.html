<!-- @dsCard group="Colors" viewport="700x160" name="Surfaces — Midnight scale" subtitle="void → midnight → aubergine → plum → orchid" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-base);color:var(--text-primary);font-family:var(--font-body);padding:18px;display:flex;gap:10px;height:160px;box-sizing:border-box;}
  .sw{flex:1;border:2px solid var(--border-default);display:flex;flex-direction:column;justify-content:space-between;padding:10px;font-size:13px;}
  .sw b{font-family:var(--font-display);font-size:9px;letter-spacing:.1em;color:var(--text-primary);}
  .sw code{font-size:13px;color:var(--text-secondary);}
</style></head><body>
  <div class="sw" style="background:var(--void)"><b>VOID</b><code>#07000f</code></div>
  <div class="sw" style="background:var(--midnight)"><b>MIDNIGHT</b><code>#100225</code></div>
  <div class="sw" style="background:var(--aubergine)"><b>AUBERGINE</b><code>#1c0838</code></div>
  <div class="sw" style="background:var(--plum)"><b>PLUM</b><code>#2d0a55</code></div>
  <div class="sw" style="background:var(--orchid)"><b>ORCHID</b><code>#4a1a8a</code></div>
</body></html>
