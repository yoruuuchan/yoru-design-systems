<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="--s-1 (4px) → --s-9 (96px)" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-base);color:var(--text-primary);font-family:var(--font-body);padding:18px;height:150px;box-sizing:border-box;display:flex;align-items:flex-end;gap:12px;}
  .col{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--text-muted);}
  .bar{background:var(--magenta);width:18px;box-shadow:var(--glow-magenta-sm);}
</style></head><body>
  <div class="col"><div class="bar" style="height:4px"></div>4</div>
  <div class="col"><div class="bar" style="height:8px"></div>8</div>
  <div class="col"><div class="bar" style="height:12px"></div>12</div>
  <div class="col"><div class="bar" style="height:16px"></div>16</div>
  <div class="col"><div class="bar" style="height:24px"></div>24</div>
  <div class="col"><div class="bar" style="height:32px"></div>32</div>
  <div class="col"><div class="bar" style="height:48px"></div>48</div>
  <div class="col"><div class="bar" style="height:64px"></div>64</div>
  <div class="col"><div class="bar" style="height:96px"></div>96</div>
</body></html>
