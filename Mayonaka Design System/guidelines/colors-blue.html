<!-- @dsCard group="Colors" viewport="700x170" name="Blue family" subtitle="electric / azure / neon-blue / deep-blue / indigo" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-void);color:var(--text-primary);font-family:var(--font-body);padding:18px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;height:170px;box-sizing:border-box;}
  .sw{border:2px solid rgba(255,255,255,.08);padding:8px;display:flex;flex-direction:column;justify-content:space-between;font-size:11px;color:#fff;}
  .sw b{font-family:var(--font-display);font-size:8px;letter-spacing:.1em;background:rgba(0,0,0,.45);padding:2px 4px;align-self:flex-start;}
  .sw code{background:rgba(0,0,0,.45);padding:1px 3px;font-size:11px;align-self:flex-start;}
</style></head><body>
  <div class="sw" style="background:var(--electric);box-shadow:var(--glow-blue-sm) inset"><b>ELECTRIC</b><code>#2d6cff</code></div>
  <div class="sw" style="background:var(--azure)"><b>AZURE</b><code>#4aa3ff</code></div>
  <div class="sw" style="background:var(--neon-blue);box-shadow:var(--glow-cyan-sm) inset"><b>NEON BLUE</b><code>#00b3ff</code></div>
  <div class="sw" style="background:var(--deep-blue)"><b>DEEP BLUE</b><code>#0a1654</code></div>
  <div class="sw" style="background:var(--indigo)"><b>INDIGO</b><code>#3a1a8a</code></div>
</body></html>
