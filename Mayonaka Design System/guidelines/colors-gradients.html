<!-- @dsCard group="Colors" viewport="700x180" name="Signature gradients" subtitle="sunset / neon / night — the heart of the brand" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-void);color:var(--text-primary);font-family:var(--font-body);padding:18px;display:flex;gap:12px;height:180px;box-sizing:border-box;}
  .g{flex:1;border:2px solid var(--border-default);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;}
  .g b{font-family:var(--font-display);font-size:9px;letter-spacing:.1em;color:#fff;background:rgba(0,0,0,.55);padding:3px 6px;align-self:flex-start;}
  .g code{color:#fff;background:rgba(0,0,0,.55);padding:2px 5px;font-size:12px;align-self:flex-start;margin-top:4px;}
</style></head><body>
  <div class="g" style="background:var(--grad-sunset)"><b>SUNSET</b><code>--grad-sunset</code></div>
  <div class="g" style="background:var(--grad-neon)"><b>NEON</b><code>--grad-neon</code></div>
  <div class="g" style="background:var(--grad-night)"><b>NIGHT</b><code>--grad-night</code></div>
</body></html>
