<!-- @dsCard group="Brand" viewport="700x220" name="Logotype" subtitle="真夜中 / MAYONAKA — midnight wave" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-void);color:var(--text-primary);font-family:var(--font-body);
       padding:24px;display:flex;align-items:center;gap:32px;height:220px;box-sizing:border-box;
       background-image:radial-gradient(circle at 30% 50%,rgba(255,43,214,.18),transparent 60%),
                        radial-gradient(circle at 80% 60%,rgba(25,230,255,.15),transparent 55%);}
  .jp{font-family:var(--font-jp);font-size:56px;color:var(--magenta);text-shadow:var(--text-glow-magenta);letter-spacing:.08em;line-height:1;}
  .en{font-family:var(--font-display);font-size:18px;color:var(--cyan);text-shadow:var(--text-glow-cyan);letter-spacing:.3em;margin-top:10px;}
  .tag{font-family:var(--font-body);font-size:22px;color:var(--text-secondary);margin-top:6px;letter-spacing:.05em;}
  .divider{width:2px;height:120px;background:var(--grad-neon);}
  .mark{width:120px;height:120px;border:3px solid var(--magenta);box-shadow:var(--glow-magenta);
        display:grid;place-items:center;font-family:var(--font-jp);font-size:64px;color:var(--magenta);
        text-shadow:var(--text-glow-magenta);background:var(--bg-void);}
</style></head><body>
  <div class="mark">夜</div>
  <div class="divider"></div>
  <div>
    <div class="jp">真夜中</div>
    <div class="en">M A Y O N A K A</div>
    <div class="tag">// midnight wave system</div>
  </div>
</body></html>
