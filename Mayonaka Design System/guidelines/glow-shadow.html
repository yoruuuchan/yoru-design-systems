<!-- @dsCard group="Spacing" viewport="700x200" name="Glow & shadow" subtitle="neon glows + hard pixel shadows — the lighting" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-void);color:var(--text-primary);font-family:var(--font-body);padding:22px;height:200px;box-sizing:border-box;display:flex;gap:22px;align-items:center;flex-wrap:wrap;}
  .b{padding:14px 18px;background:var(--bg-card);font-size:13px;color:var(--text-secondary);border:2px solid var(--border-default);}
</style></head><body>
  <div class="b" style="box-shadow:var(--glow-magenta-sm);border-color:var(--magenta)">glow-magenta-sm</div>
  <div class="b" style="box-shadow:var(--glow-magenta);border-color:var(--magenta)">glow-magenta</div>
  <div class="b" style="box-shadow:var(--glow-cyan);border-color:var(--cyan)">glow-cyan</div>
  <div class="b" style="box-shadow:var(--shadow-pixel)">shadow-pixel</div>
  <div class="b" style="box-shadow:var(--shadow-pixel-magenta);border-color:var(--magenta)">pixel-magenta</div>
</body></html>
