<!-- @dsCard group="Colors" viewport="700x130" name="Semantic state colors" subtitle="success / warning / danger" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-base);font-family:var(--font-body);padding:18px;display:flex;gap:12px;height:130px;box-sizing:border-box;}
  .sw{flex:1;border:2px solid currentColor;padding:10px;display:flex;flex-direction:column;justify-content:space-between;}
  .sw b{font-family:var(--font-display);font-size:9px;letter-spacing:.1em;}
  .sw code{font-size:12px;opacity:.85;}
</style></head><body>
  <div class="sw" style="color:var(--success)"><b>SUCCESS</b><code>#6dffb5</code></div>
  <div class="sw" style="color:var(--warning)"><b>WARNING</b><code>#ffcc66</code></div>
  <div class="sw" style="color:var(--danger)"><b>DANGER</b><code>#ff3860</code></div>
</body></html>
