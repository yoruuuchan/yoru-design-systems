<!-- @dsCard group="Colors" viewport="700x170" name="Neon accents" subtitle="primary magenta + cyan, plus citypop sunset" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-void);color:var(--text-primary);font-family:var(--font-body);padding:18px;display:grid;grid-template-columns:repeat(7,1fr);gap:10px;height:170px;box-sizing:border-box;}
  .sw{border:2px solid rgba(255,255,255,.08);padding:8px;display:flex;flex-direction:column;justify-content:space-between;font-size:11px;}
  .sw b{font-family:var(--font-display);font-size:8px;letter-spacing:.08em;color:var(--void);background:rgba(255,255,255,.85);padding:2px 4px;align-self:flex-start;}
  .sw code{color:var(--void);background:rgba(255,255,255,.7);padding:1px 3px;font-size:11px;align-self:flex-start;}
</style></head><body>
  <div class="sw" style="background:var(--magenta);box-shadow:var(--glow-magenta-sm) inset"><b>MAGENTA</b><code>#ff2bd6</code></div>
  <div class="sw" style="background:var(--hot-pink)"><b>HOT PINK</b><code>#ff71ce</code></div>
  <div class="sw" style="background:var(--cyan);box-shadow:var(--glow-cyan-sm) inset"><b>CYAN</b><code>#19e6ff</code></div>
  <div class="sw" style="background:var(--aqua)"><b>AQUA</b><code>#00fff0</code></div>
  <div class="sw" style="background:var(--lavender)"><b>LAVENDER</b><code>#b59cff</code></div>
  <div class="sw" style="background:var(--sunset)"><b>SUNSET</b><code>#f97e72</code></div>
  <div class="sw" style="background:var(--amber)"><b>AMBER</b><code>#ffcc66</code></div>
</body></html>
