<!-- @dsCard group="Spacing" viewport="700x180" name="Borders & radii" subtitle="sharp pixel borders, radii used sparingly" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-base);color:var(--text-primary);font-family:var(--font-body);padding:20px;height:180px;box-sizing:border-box;display:flex;gap:18px;align-items:center;}
  .box{width:110px;height:110px;background:var(--bg-card);display:flex;align-items:flex-end;justify-content:center;padding:8px;font-size:12px;color:var(--text-secondary);text-align:center;}
</style></head><body>
  <div class="box" style="border:1px solid var(--border-default)">1px hair</div>
  <div class="box" style="border:2px solid var(--border-default)">2px default</div>
  <div class="box" style="border:3px solid var(--magenta);box-shadow:var(--glow-magenta-sm)">3px neon</div>
  <div class="box" style="border:2px solid var(--cyan);border-radius:4px">radius 4</div>
  <div class="box" style="border:2px solid var(--cyan);border-radius:999px">pill</div>
</body></html>
