<!-- @dsCard group="Type" viewport="700x180" name="JP × Latin mix" subtitle="The brand voice — vertical eyebrow, big roman, tiny JP caption" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:24px;background:linear-gradient(135deg,#EAF5FF 0%,#CFE8FF 100%);">
  <style>
    .frame { display:grid; grid-template-columns:auto 1fr auto; gap:24px;
             align-items:center; height:100%; }
    .eyebrow { writing-mode:vertical-rl; text-orientation:mixed;
               font-family:var(--font-sans); font-size:10px;
               letter-spacing:0.32em; color:var(--text-muted);
               font-weight:500; }
    .hero { font-family:var(--font-display); font-weight:900;
            font-size:64px; line-height:0.95; letter-spacing:-0.04em;
            color:var(--neutral-900); }
    .hero small { display:block; font-size:11px; letter-spacing:0.24em;
                  font-weight:500; color:var(--text-muted); margin-top:8px; }
    .corner { font-family:var(--font-mono); font-size:9px; line-height:1.5;
              color:var(--text-muted); text-align:right; }
    .corner b { display:block; color:var(--text-strong); font-weight:600;
                font-family:var(--font-sans); font-size:11px;
                letter-spacing:0.08em; }
  </style>
  <div class="frame">
    <div class="eyebrow">VOL.05 · 夏号</div>
    <div class="hero">SODA<small>蒼い空、冷たい一杯。</small></div>
    <div class="corner"><b>AOZORA</b>NO.0825<br>26.06.23</div>
  </div>
</body></html>
