<!-- @dsCard group="Colors" viewport="700x180" name="Neutrals" subtitle="Slight blue cast — white reads as sky-lit paper" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:20px;background:var(--neutral-0);">
  <style>
    .row { display:grid; grid-template-columns:repeat(11,1fr); gap:6px; }
    .sw { aspect-ratio:1; border-radius:10px; display:flex; flex-direction:column;
          justify-content:flex-end; padding:8px; color:var(--neutral-0);
          font-family:var(--font-mono); font-size:9px; }
    .sw small { display:block; opacity:0.8; font-weight:500; }
    .sw.light { color:var(--neutral-700); }
    .sw.bordered { box-shadow:inset 0 0 0 1px var(--stroke-hairline); }
    .label { font-family:var(--font-mono); font-size:10px; color:var(--text-muted);
             margin-top:6px; display:flex; justify-content:space-between; }
  </style>
  <div class="row">
    <div class="sw light bordered" style="background:#FFFFFF">0<small>FFFFFF</small></div>
    <div class="sw light" style="background:#F7FAFD">50<small>F7FAFD</small></div>
    <div class="sw light" style="background:#EEF3F8">100<small>EEF3F8</small></div>
    <div class="sw light" style="background:#DCE5EF">200<small>DCE5EF</small></div>
    <div class="sw light" style="background:#BCC9D6">300<small>BCC9D6</small></div>
    <div class="sw"       style="background:#8A9AAB">400<small>8A9AAB</small></div>
    <div class="sw"       style="background:#5C6B7C">500<small>5C6B7C</small></div>
    <div class="sw"       style="background:#3D4956">600<small>3D4956</small></div>
    <div class="sw"       style="background:#232C36">700<small>232C36</small></div>
    <div class="sw"       style="background:#131922">800<small>131922</small></div>
    <div class="sw"       style="background:#07090E">900<small>07090E</small></div>
  </div>
  <div class="label"><span>neutral-0</span><span>11 stops · cool bias</span><span>neutral-900</span></div>
</body></html>
