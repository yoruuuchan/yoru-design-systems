<!-- @dsCard group="Colors" viewport="700x180" name="Brand · Sky Blue" subtitle="--blue-50 → --blue-900, primary at 500" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:20px;background:var(--neutral-0);">
  <style>
    .row { display:grid; grid-template-columns:repeat(10,1fr); gap:6px; }
    .sw { aspect-ratio:1; border-radius:10px; display:flex; flex-direction:column;
          justify-content:flex-end; padding:8px; color:var(--neutral-0);
          font-family:var(--font-mono); font-size:9px;
          box-shadow:var(--inset-rim); }
    .sw small { display:block; opacity:0.8; font-weight:500; }
    .sw.light { color:var(--neutral-800); }
    .label { font-family:var(--font-mono); font-size:10px; color:var(--text-muted);
             margin-top:6px; display:flex; justify-content:space-between; }
    .star { position:absolute; top:6px; right:8px; color:var(--sun-400);
            font-size:12px; }
  </style>
  <div class="row">
    <div class="sw light" style="background:#EAF5FF;position:relative">50<small>EAF5FF</small></div>
    <div class="sw light" style="background:#CFE8FF;position:relative">100<small>CFE8FF</small></div>
    <div class="sw light" style="background:#9DD2FF;position:relative">200<small>9DD2FF</small></div>
    <div class="sw light" style="background:#66B7FF;position:relative">300<small>66B7FF</small></div>
    <div class="sw"       style="background:#339BFF;position:relative">400<small>339BFF</small></div>
    <div class="sw"       style="background:#0A84FF;position:relative">500<small>0A84FF</small><span class="star">★</span></div>
    <div class="sw"       style="background:#006FE0;position:relative">600<small>006FE0</small></div>
    <div class="sw"       style="background:#005BB8;position:relative">700<small>005BB8</small></div>
    <div class="sw"       style="background:#004690;position:relative">800<small>004690</small></div>
    <div class="sw"       style="background:#003068;position:relative">900<small>003068</small></div>
  </div>
  <div class="label"><span>blue-50</span><span style="color:var(--sun-500)">★ primary = --blue-500</span><span>blue-900</span></div>
</body></html>
