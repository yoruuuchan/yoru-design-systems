<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:0;background:linear-gradient(180deg,#CFE8FF 0%,#EAF5FF 100%);">
  <style>
    .row { display:grid; grid-template-columns:repeat(4,1fr); height:220px; }
    .cell { display:flex; align-items:center; justify-content:center; padding:18px;
            position:relative; }
    .lbl { position:absolute; bottom:8px; left:12px;
           font-family:var(--font-mono); font-size:9px;
           letter-spacing:0.16em; text-transform:uppercase;
           color:var(--neutral-700); }
  </style>
  <div class="row">
    <div class="cell"><img src="../assets/glass-blob.svg" alt="" style="height:150px"><span class="lbl">glass-blob</span></div>
    <div class="cell"><img src="../assets/liquid-drop.svg" alt="" style="height:160px"><span class="lbl">liquid-drop</span></div>
    <div class="cell"><img src="../assets/droplets.svg" alt="" style="height:130px"><span class="lbl">droplets</span></div>
    <div class="cell"><img src="../assets/sun.svg" alt="" style="height:150px"><span class="lbl">sun</span></div>
  </div>
</body></html>
