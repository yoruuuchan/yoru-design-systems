<!-- @dsCard group="Spacing" viewport="700x180" name="Motion · easing curves" subtitle="quart · expo · spring · bounce — curves + live motion" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:18px 20px;background:var(--neutral-0);">
  <style>
    .row { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
    .cell { padding:12px; border-radius:14px; background:var(--neutral-50);
            display:flex; flex-direction:column; gap:10px; }
    .name { font-family:var(--font-mono); font-size:11px; color:var(--text-strong); font-weight:600; }
    .curve { width:100%; height:54px; display:block; }
    .curve path.guide { stroke:var(--stroke-subtle); stroke-width:1; fill:none; stroke-dasharray:2 3; }
    .curve path.line  { stroke:var(--blue-500); stroke-width:2; fill:none; }
    .track { position:relative; height:18px; background:var(--neutral-200); border-radius:999px; overflow:hidden; }
    .ball { position:absolute; top:1px; left:1px; width:16px; height:16px; border-radius:50%;
            background:linear-gradient(135deg,#9DD2FF,#0A84FF);
            box-shadow:var(--inset-rim), 0 1px 2px rgba(10,68,140,0.3);
            animation-duration:1800ms; animation-iteration-count:infinite; }
    .t1 { animation-name:m1; animation-timing-function:cubic-bezier(0.25,1,0.5,1); }
    .t2 { animation-name:m1; animation-timing-function:cubic-bezier(0.16,1,0.3,1); }
    .t3 { animation-name:m1; animation-timing-function:cubic-bezier(0.34,1.56,0.64,1); }
    .t4 { animation-name:m1; animation-timing-function:cubic-bezier(0.68,-0.6,0.32,1.6); }
    @keyframes m1 {
      0%, 10%   { left: 1px; }
      55%, 70%  { left: calc(100% - 17px); }
      95%, 100% { left: 1px; }
    }
    small { font-family:var(--font-mono); font-size:9px; color:var(--text-muted); }
  </style>
  <div class="row">

    <div class="cell">
      <div class="name">quart-out</div>
      <svg class="curve" viewBox="0 0 100 50" preserveAspectRatio="none">
        <path class="guide" d="M0 50 L100 0"/>
        <!-- cubic-bezier(0.25,1,0.5,1) — y inverted because SVG y grows down -->
        <path class="line" d="M0 50 C25 0, 50 0, 100 0"/>
      </svg>
      <div class="track"><div class="ball t1"></div></div>
      <small>0.25, 1, 0.5, 1</small>
    </div>

    <div class="cell">
      <div class="name">expo-out</div>
      <svg class="curve" viewBox="0 0 100 50" preserveAspectRatio="none">
        <path class="guide" d="M0 50 L100 0"/>
        <!-- cubic-bezier(0.16,1,0.3,1) — very fast start -->
        <path class="line" d="M0 50 C16 0, 30 0, 100 0"/>
      </svg>
      <div class="track"><div class="ball t2"></div></div>
      <small>0.16, 1, 0.3, 1</small>
    </div>

    <div class="cell">
      <div class="name">spring</div>
      <svg class="curve" viewBox="0 0 100 50" preserveAspectRatio="none">
        <path class="guide" d="M0 50 L100 0"/>
        <!-- cubic-bezier(0.34,1.56,0.64,1) — small overshoot -->
        <path class="line" d="M0 50 C34 -28, 64 0, 100 0"/>
      </svg>
      <div class="track"><div class="ball t3"></div></div>
      <small>0.34, 1.56, 0.64, 1</small>
    </div>

    <div class="cell">
      <div class="name">bounce</div>
      <svg class="curve" viewBox="0 0 100 50" preserveAspectRatio="none">
        <path class="guide" d="M0 50 L100 0"/>
        <!-- cubic-bezier(0.68,-0.6,0.32,1.6) — dip below then overshoot above -->
        <path class="line" d="M0 50 C68 80, 32 -30, 100 0"/>
      </svg>
      <div class="track"><div class="ball t4"></div></div>
      <small>0.68, -0.6, 0.32, 1.6</small>
    </div>

  </div>
</body></html>
