<!-- @dsCard group="Colors" viewport="700x150" name="Supporting hues" subtitle="Mint · Coral · Peach · Lilac — for illustrations & badges only" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:20px;background:var(--neutral-0);">
  <style>
    .row { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; }
    .sw { aspect-ratio:1.4; border-radius:12px; padding:10px;
          font-family:var(--font-mono); font-size:10px; display:flex;
          flex-direction:column; justify-content:space-between; color:var(--neutral-800); }
    .sw small { display:block; opacity:0.65; font-weight:500; }
    .sw b { font-family:var(--font-sans); font-size:11px; font-weight:600; }
  </style>
  <div class="row">
    <div class="sw" style="background:#5FE3CC"><b>Mint 400</b><small>5FE3CC</small></div>
    <div class="sw" style="background:#34D9C2"><b>Mint 500</b><small>34D9C2</small></div>
    <div class="sw" style="background:#FF8A80"><b>Coral 400</b><small>FF8A80</small></div>
    <div class="sw" style="background:#FF6B6B"><b>Coral 500</b><small>FF6B6B</small></div>
    <div class="sw" style="background:#FFB199"><b>Peach 400</b><small>FFB199</small></div>
    <div class="sw" style="background:#C8B8FF"><b>Lilac 400</b><small>C8B8FF</small></div>
  </div>
</body></html>
