<!-- @dsCard group="Colors" viewport="700x230" name="Sky gradients" subtitle="Times of day — default backgrounds for posters and screens" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:20px;background:var(--neutral-0);">
  <style>
    .row { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
    .g { aspect-ratio:0.7; border-radius:14px; position:relative;
         box-shadow:var(--inset-rim), var(--shadow-sm); overflow:hidden; }
    .g b { position:absolute; left:10px; bottom:32px; color:#fff;
           font-family:var(--font-display); font-weight:700; font-size:13px;
           letter-spacing:-0.01em; text-shadow:0 1px 3px rgba(0,0,0,0.25); }
    .g small { position:absolute; left:10px; bottom:10px; color:#fff;
               font-family:var(--font-mono); font-size:9px; opacity:0.85;
               text-shadow:0 1px 3px rgba(0,0,0,0.25); }
  </style>
  <div class="row">
    <div class="g" style="background:linear-gradient(180deg,#EAF5FF 0%,#CFE8FF 35%,#9DD2FF 70%,#FFE980 100%)"><b>Morning</b><small>--gradient-morning</small></div>
    <div class="g" style="background:linear-gradient(180deg,#66B7FF 0%,#9DD2FF 50%,#EAF5FF 100%)"><b>Noon</b><small>--gradient-noon</small></div>
    <div class="g" style="background:linear-gradient(180deg,#0A84FF 0%,#66B7FF 60%,#CFE8FF 100%)"><b>Afternoon</b><small>--gradient-afternoon</small></div>
    <div class="g" style="background:linear-gradient(180deg,#FFB199 0%,#FFE34D 45%,#9DD2FF 100%)"><b>Sunset</b><small>--gradient-sunset</small></div>
    <div class="g" style="background:linear-gradient(180deg,#004690 0%,#006FE0 50%,#FFB199 100%)"><b>Twilight</b><small>--gradient-twilight</small></div>
  </div>
</body></html>
