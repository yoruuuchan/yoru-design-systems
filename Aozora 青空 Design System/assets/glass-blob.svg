
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Glass orb">
  <defs>
    <radialGradient id="gb-body" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0%" stop-color="#EAF5FF" stop-opacity="0.6"></stop>
      <stop offset="55%" stop-color="#66B7FF" stop-opacity="0.65"></stop>
      <stop offset="100%" stop-color="#003068" stop-opacity="0.85"></stop>
    </radialGradient>
    <radialGradient id="gb-warm" cx="0.7" cy="0.75" r="0.45">
      <stop offset="0%" stop-color="#FFE980" stop-opacity="0.75"></stop>
      <stop offset="80%" stop-color="#FFE980" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="gb-cool" cx="0.25" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#5FE3CC" stop-opacity="0.55"></stop>
      <stop offset="100%" stop-color="#5FE3CC" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="gb-rim" cx="0.5" cy="0.5" r="0.5">
      <stop offset="93%" stop-color="#FFFFFF" stop-opacity="0"></stop>
      <stop offset="98%" stop-color="#FFFFFF" stop-opacity="0.55"></stop>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="gb-hl" x1="0.2" y1="0.1" x2="0.6" y2="0.6">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"></stop>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"></stop>
    </linearGradient>
    <filter id="gb-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"></feGaussianBlur>
    </filter>
  </defs>

  
  <circle cx="240" cy="245" r="220" fill="#66B7FF" opacity="0.12"></circle>

  
  <circle cx="240" cy="240" r="190" fill="url(#gb-body)"></circle>
  
  <circle cx="240" cy="240" r="190" fill="url(#gb-warm)"></circle>
  
  <circle cx="240" cy="240" r="190" fill="url(#gb-cool)"></circle>

  
  <ellipse cx="170" cy="160" rx="120" ry="80" fill="url(#gb-hl)" filter="url(#gb-soft)"></ellipse>

  
  <ellipse cx="240" cy="270" rx="170" ry="18" fill="#FFFFFF" opacity="0.25"></ellipse>
  <ellipse cx="240" cy="320" rx="155" ry="10" fill="#003068" opacity="0.18"></ellipse>

  
  <circle cx="240" cy="240" r="188" fill="url(#gb-rim)"></circle>

  
  <circle cx="195" cy="135" r="6" fill="#FFFFFF" opacity="0.9"></circle>
  <circle cx="305" cy="180" r="3" fill="#FFFFFF" opacity="0.7"></circle>
</svg>