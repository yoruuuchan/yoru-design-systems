<!doctype html>
<!-- @dsCard group="Colors" name="Palette · akari" subtitle="Calm royal blue + cool porcelain surfaces" viewport="700x260" --><html><head><meta charset="utf-8"><title>akari palette</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 16px 18px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .sw { border-radius: 10px; aspect-ratio: 1.2/1; padding: 8px; display: flex; flex-direction: column; justify-content: space-between; color: #0E1525; font-family: var(--font-ui); }
  .sw.on-dark { color: #fff; }
  .sw .nm { font-size: 11px; font-weight: 600; letter-spacing: -0.01em; }
  .sw .hx { font-family: var(--font-mono); font-size: 10px; opacity: 0.7; }
  .group { margin-top: 4px; }
  .group h4 { margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
</style></head>
<body data-theme="akari">
  <div class="group">
    <h4>Primary · calm royal blue</h4>
    <div class="grid">
      <div class="sw" style="background:#EEF2FF"><span class="nm">50</span><span class="hx">#EEF2FF</span></div>
      <div class="sw" style="background:#DCE3FE"><span class="nm">100</span><span class="hx">#DCE3FE</span></div>
      <div class="sw" style="background:#B9C6FD"><span class="nm">200</span><span class="hx">#B9C6FD</span></div>
      <div class="sw" style="background:#92A8FB"><span class="nm">300</span><span class="hx">#92A8FB</span></div>
      <div class="sw on-dark" style="background:#6E89F2"><span class="nm">400</span><span class="hx">#6E89F2</span></div>
      <div class="sw on-dark" style="background:#4F6CE8"><span class="nm">500</span><span class="hx">#4F6CE8</span></div>
      <div class="sw on-dark" style="background:#3D58D4"><span class="nm">600</span><span class="hx">#3D58D4</span></div>
      <div class="sw on-dark" style="background:#2E44B0"><span class="nm">700</span><span class="hx">#2E44B0</span></div>
      <div class="sw on-dark" style="background:#233587"><span class="nm">800</span><span class="hx">#233587</span></div>
      <div class="sw on-dark" style="background:#182763"><span class="nm">900</span><span class="hx">#182763</span></div>
    </div>
  </div>
  <div class="group" style="margin-top:14px">
    <h4>Surfaces & ink — akari</h4>
    <div class="grid" style="grid-template-columns: repeat(5, 1fr);">
      <div class="sw" style="background:#E8ECF3; box-shadow: inset 0 0 0 1px rgba(14,21,37,0.05)"><span class="nm">bg-base</span><span class="hx">#E8ECF3</span></div>
      <div class="sw" style="background:#EFF2F8"><span class="nm">surface</span><span class="hx">#EFF2F8</span></div>
      <div class="sw" style="background:#F6F8FC"><span class="nm">elevated</span><span class="hx">#F6F8FC</span></div>
      <div class="sw" style="background:#DEE3EC"><span class="nm">sunken</span><span class="hx">#DEE3EC</span></div>
      <div class="sw on-dark" style="background:#0E1525"><span class="nm">ink-1</span><span class="hx">#0E1525</span></div>
    </div>
  </div>
</body></html>
