<!doctype html>
<!-- @dsCard group="Colors" name="Ember accent" subtitle="Sparing warmth — pure orange glow" viewport="700x220" --><html><head><meta charset="utf-8"><title>ember accent</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 18px 20px; }
  .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .pane { padding: 16px; border-radius: 16px; position: relative; overflow: hidden; }
  .pane.akari { background: var(--bg-base); }
  .pane.yoru  { background: var(--bg-base); color: var(--ink-1); }
  .lamp {
    width: 84px; height: 84px; border-radius: 50%; margin: 4px auto 12px;
    background: radial-gradient(circle at 35% 30%, #FFD4B0, var(--ember-500) 55%, var(--ember-700) 100%);
    box-shadow: 0 0 30px rgba(240, 106, 32, 0.50), 0 0 60px rgba(240, 106, 32, 0.22);
  }
  .pane.yoru .lamp {
    background: radial-gradient(circle at 35% 30%, #FFD4B0, var(--ember-500) 60%, var(--ember-300) 100%);
    box-shadow: 0 0 34px rgba(240, 120, 48, 0.55), 0 0 80px rgba(240, 120, 48, 0.22);
  }
  .row { display: flex; gap: 6px; justify-content: center; }
  .sw { width: 40px; height: 28px; border-radius: 8px; }
  .nm { font-size: 10px; font-family: var(--font-mono); text-align: center; margin-top: 4px; opacity: 0.65; }
  .role { text-align: center; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; opacity: 0.7; margin-bottom: 4px; }
  .name { text-align: center; font-size: 14px; font-weight: 600; }
  .sub { text-align: center; font-size: 11px; opacity: 0.6; margin-top: 2px; font-family: var(--font-jp); }
</style></head>
<body>
  <div class="wrap">
    <div class="pane akari">
      <div class="role">akari · ember</div>
      <div class="lamp"></div>
      <div class="name">pure orange</div>
      <div class="sub">灯 — sparing warmth on cool surfaces</div>
      <div class="row" style="margin-top:12px">
        <div><div class="sw" style="background:var(--ember-100)"></div><div class="nm">100</div></div>
        <div><div class="sw" style="background:var(--ember-300)"></div><div class="nm">300</div></div>
        <div><div class="sw" style="background:var(--ember-500)"></div><div class="nm">500</div></div>
        <div><div class="sw" style="background:var(--ember-700)"></div><div class="nm">700</div></div>
      </div>
    </div>
    <div class="pane yoru" data-theme="yoru">
      <div class="role">yoru · ember</div>
      <div class="lamp"></div>
      <div class="name">bright amber</div>
      <div class="sub">琥珀 — warmth that survives the dark</div>
      <div class="row" style="margin-top:12px">
        <div><div class="sw" style="background:var(--ember-100)"></div><div class="nm">100</div></div>
        <div><div class="sw" style="background:var(--ember-300)"></div><div class="nm">300</div></div>
        <div><div class="sw" style="background:var(--ember-500)"></div><div class="nm">500</div></div>
        <div><div class="sw" style="background:var(--ember-700)"></div><div class="nm">700</div></div>
      </div>
    </div>
  </div>
</body></html>
