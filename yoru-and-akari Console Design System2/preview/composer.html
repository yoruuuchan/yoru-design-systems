<!doctype html>
<!-- @dsCard group="Components" name="Composer" subtitle="Inset textarea + send + tools tray" viewport="700x200" --><html><head><meta charset="utf-8"><title>composer</title>
<link rel="stylesheet" href="_base.css">
<script src="https://unpkg.com/lucide@0.452.0/dist/umd/lucide.min.js"></script>
<style>
  body { padding: 16px 18px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .pane { padding: 18px 14px; border-radius: 16px; display: flex; flex-direction: column; justify-content: flex-end; min-height: 140px; }
  .pane.akari { background: #E8ECF3; color: #0E1525; }
  .pane.yoru  { background: #0B1020; color: #E6EAF6; }
  .tag { font-size: 10px; font-family: var(--font-mono); }
  .pane.akari .tag { color: #6B7793; }
  .pane.yoru  .tag { color: #A8B2CC; }

  .comp { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 14px; border-radius: 22px; margin-top: 10px; }
  .akari .comp { background: #EFF2F8; box-shadow: inset 2px 2px 6px rgba(143,158,191,0.28), inset -2px -2px 5px rgba(255,255,255,0.95); }
  .yoru  .comp { background: #080D1B; box-shadow: inset 2px 2px 6px rgba(0,0,0,0.55), inset -2px -2px 5px rgba(255,255,255,0.04); }

  .comp input {
    flex: 1; border: none; background: transparent; outline: none;
    font-family: var(--font-ui); font-size: 13px; color: inherit; height: 32px;
  }
  .akari .comp input::placeholder { color: #A1ABBF; }
  .yoru  .comp input::placeholder { color: #434D67; }

  .ic-btn { width: 34px; height: 34px; border-radius: 99px; display: grid; place-items: center; border: none; cursor: pointer; }
  .akari .ic-btn { background: transparent; color: #6B7793; }
  .yoru  .ic-btn { background: transparent; color: #A8B2CC; }
  .akari .ic-btn.send { background: #4F6CE8; color: #fff; box-shadow: 0 3px 10px rgba(79,108,232,0.30); }
  .yoru  .ic-btn.send { background: #7A95FA; color: #0B1020; box-shadow: 0 3px 12px rgba(122,149,250,0.30); }
  .ic-btn svg { width: 16px; height: 16px; stroke-width: 2; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { padding: 5px 10px; border-radius: 99px; font-size: 11px; font-weight: 500; }
  .akari .chip { background: #EFF2F8; color: #394560; box-shadow: -1px -1px 3px rgba(255,255,255,0.95), 2px 2px 5px rgba(143,158,191,0.28); }
  .yoru  .chip { background: #131A2E; color: #A8B2CC; box-shadow: -1px -1px 3px rgba(255,255,255,0.04), 2px 2px 6px rgba(0,0,0,0.4); }

  .draft { font-size: 11px; opacity: 0.55; font-family: var(--font-mono); padding: 0 6px 4px; display: flex; justify-content: space-between; }
</style></head>
<body>
  <div class="grid">
    <div class="pane akari">
      <span class="tag">akari · composer</span>
      <div style="flex:1"></div>
      <div class="chips">
        <span class="chip">+ memory</span>
        <span class="chip">+ worldbook · "small kitchen"</span>
      </div>
      <div class="comp">
        <input placeholder="say something to akari…" value="soft tone, just a nudge for the 14:00 thing">
        <button class="ic-btn"><i data-lucide="paperclip"></i></button>
        <button class="ic-btn"><i data-lucide="mic"></i></button>
        <button class="ic-btn send"><i data-lucide="arrow-up"></i></button>
      </div>
      <div class="draft"><span>draft auto-saved</span><span>42 / 4k tokens</span></div>
    </div>
    <div class="pane yoru">
      <span class="tag">yoru · composer</span>
      <div style="flex:1"></div>
      <div class="chips">
        <span class="chip">+ memory</span>
        <span class="chip">+ tool · web</span>
      </div>
      <div class="comp">
        <input placeholder="something on your mind?" value="">
        <button class="ic-btn"><i data-lucide="paperclip"></i></button>
        <button class="ic-btn"><i data-lucide="mic"></i></button>
        <button class="ic-btn send"><i data-lucide="arrow-up"></i></button>
      </div>
      <div class="draft"><span>quiet hours · 21:00–07:30</span><span>0 / 4k</span></div>
    </div>
  </div>
  <script>lucide.createIcons();</script>
</body></html>
