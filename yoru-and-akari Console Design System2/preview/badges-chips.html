<!doctype html>
<!-- @dsCard group="Components" name="Badges & chips" subtitle="Status badges and selectable chips" viewport="700x200" --><html><head><meta charset="utf-8"><title>badges & chips</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 18px 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .pane { padding: 14px 16px; border-radius: 16px; }
  .pane.akari { background: var(--bg-base); color: var(--ink-1); }
  .pane.yoru  { background: var(--bg-base); color: var(--ink-1); }
  .tag { font-size: 10px; font-family: var(--font-mono); margin-bottom: 10px; display: block; }
  .pane.akari .tag { color: var(--ink-3); }
  .pane.yoru .tag { color: var(--ink-2); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .lbl { font-size: 10px; font-family: var(--font-mono); width: 64px; }
  .pane.akari .lbl { color: var(--ink-3); }
  .pane.yoru .lbl { color: var(--ink-3); }

  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 99px; font-size: 11px; font-weight: 500; }
  .dot { width: 6px; height: 6px; border-radius: 99px; }

  /* akari semantics */
  .akari .b-ok    { background: var(--success-100); color: var(--success-700); }
  .akari .b-warn  { background: var(--warning-100); color: var(--warning-700); }
  .akari .b-err   { background: var(--error-100); color: var(--error-700); }
  .akari .b-info  { background: var(--primary-100); color: var(--primary-700); }
  .akari .b-mute  { background: var(--bg-sunken); color: var(--ink-3); }
  .akari .b-ember { background: var(--ember-100); color: var(--ember-700); }
  .akari .b-frost { background: var(--frost-100); color: var(--frost-700); }
  /* yoru semantics */
  .yoru .b-ok    { background: var(--success-100); color: var(--success-700); }
  .yoru .b-warn  { background: var(--warning-100); color: var(--warning-700); }
  .yoru .b-err   { background: var(--error-100); color: var(--error-700); }
  .yoru .b-info  { background: var(--primary-100); color: var(--primary-700); }
  .yoru .b-mute  { background: var(--bg-surface); color: var(--ink-2); }
  .yoru .b-ember { background: var(--ember-100); color: var(--ember-700); }
  .yoru .b-frost { background: var(--frost-100); color: var(--frost-700); }

  /* chip (selectable) */
  .chip { padding: 5px 10px; border-radius: 99px; font-size: 11px; font-weight: 500; cursor: pointer; }
  .akari .chip { background: var(--bg-base); color: var(--ink-2); box-shadow: -1px -1px 3px rgba(255,255,255,0.95), 2px 2px 5px rgba(143,158,191,0.30); }
  .akari .chip.on { background: var(--primary-500); color: #fff; box-shadow: inset 2px 2px 4px rgba(0,0,0,0.18); }
  .yoru .chip { background: var(--bg-surface); color: var(--ink-2); box-shadow: -1px -1px 3px rgba(255,255,255,0.04), 2px 2px 6px rgba(0,0,0,0.4); }
  .yoru .chip.on { background: var(--primary-500); color: var(--bg-base); box-shadow: inset 2px 2px 5px rgba(0,0,0,0.25); }
</style></head>
<body>
  <div class="grid">
    <div class="pane akari">
      <span class="tag">akari · badges & chips</span>
      <div class="row"><span class="lbl">status</span>
        <span class="badge b-ok"><span class="dot" style="background:var(--success-500)"></span>saved</span>
        <span class="badge b-warn"><span class="dot" style="background:var(--warning-500)"></span>unsaved</span>
        <span class="badge b-err"><span class="dot" style="background:var(--error-500)"></span>error</span>
        <span class="badge b-info"><span class="dot" style="background:var(--primary-500)"></span>syncing</span>
        <span class="badge b-mute">draft</span>
        <span class="badge b-ember">ember</span>
        <span class="badge b-frost">frost</span>
      </div>
      <div class="row" style="margin-top:8px"><span class="lbl">chips</span>
        <span class="chip on">memory</span>
        <span class="chip">worldbook</span>
        <span class="chip">tools</span>
        <span class="chip">safety</span>
      </div>
    </div>
    <div class="pane yoru" data-theme="yoru">
      <span class="tag">yoru · badges & chips</span>
      <div class="row"><span class="lbl">status</span>
        <span class="badge b-ok"><span class="dot" style="background:var(--success-500)"></span>saved</span>
        <span class="badge b-warn"><span class="dot" style="background:var(--warning-500)"></span>unsaved</span>
        <span class="badge b-err"><span class="dot" style="background:var(--error-500)"></span>error</span>
        <span class="badge b-info"><span class="dot" style="background:var(--primary-500)"></span>syncing</span>
        <span class="badge b-mute">draft</span>
        <span class="badge b-ember">ember</span>
        <span class="badge b-frost">frost</span>
      </div>
      <div class="row" style="margin-top:8px"><span class="lbl">chips</span>
        <span class="chip on">memory</span>
        <span class="chip">worldbook</span>
        <span class="chip">tools</span>
        <span class="chip">safety</span>
      </div>
    </div>
  </div>
</body></html>
