<!doctype html>
<!-- @dsCard group="Brand" name="Brand mark" subtitle="Lamp + crescent · yoru × akari" viewport="700x220" --><html><head><meta charset="utf-8"><title>brand mark</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 18px 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .pane { padding: 22px 20px 20px; border-radius: 18px; display: flex; flex-direction: column; gap: 14px; }
  .pane.akari { background: linear-gradient(160deg, var(--bg-elevated), var(--bg-base)); color: var(--ink-1); }
  .pane.yoru  { background: linear-gradient(160deg, var(--bg-surface), var(--bg-base)); color: var(--ink-1); }

  /* The mark:
       akari (灯) — warm orange lamp on the LEFT
       yoru (夜) — cool indigo night on the RIGHT
       they overlap slightly to show duality, the lamp ON the dark. */
  .mark { position: relative; width: 104px; height: 56px; margin: 0 auto; }

  .mark .akari-side {
    position: absolute; left: 0; top: 0;
    width: 56px; height: 56px; border-radius: 50%;
    z-index: 2;
  }
  .mark .yoru-side {
    position: absolute; right: 0; top: 0;
    width: 56px; height: 56px; border-radius: 50%;
    z-index: 1;
  }

  /* akari (lamp) — pure warm orange */
  .pane.akari .akari-side {
    background:
      radial-gradient(circle at 35% 30%, #FFD4B0 0 16%, var(--ember-300) 48%, var(--ember-500) 100%);
    box-shadow:
      0 0 0 3px var(--bg-elevated),
      0 0 44px rgba(240, 106, 32, 0.50),
      inset -5px -7px 12px rgba(192, 80, 21, 0.28);
  }
  .pane.yoru .akari-side {
    background:
      radial-gradient(circle at 35% 30%, #FFD4B0 0 16%, var(--ember-700) 50%, var(--ember-500) 100%);
    box-shadow:
      0 0 0 3px var(--bg-surface),
      0 0 56px rgba(240, 106, 32, 0.55),
      inset -5px -7px 12px rgba(192, 80, 21, 0.40);
  }

  /* yoru (night) — cool */
  .pane.akari .yoru-side {
    background:
      radial-gradient(circle at 70% 28%, var(--primary-200) 0 8%, transparent 14%),
      radial-gradient(circle at 32% 30%, #2A3878 0 55%, var(--primary-900) 90%);
    box-shadow:
      0 0 0 3px var(--bg-elevated),
      inset -6px -6px 12px rgba(0, 0, 0, 0.28),
      inset 4px 4px 10px rgba(122, 149, 250, 0.22),
      0 8px 22px rgba(40, 56, 120, 0.18);
  }
  .pane.yoru .yoru-side {
    background:
      radial-gradient(circle at 70% 28%, var(--primary-800) 0 8%, transparent 14%),
      radial-gradient(circle at 32% 30%, var(--primary-300) 0 50%, var(--primary-100) 88%);
    box-shadow:
      0 0 0 3px var(--bg-surface),
      inset -6px -6px 12px rgba(0, 0, 0, 0.45),
      inset 4px 4px 10px rgba(122, 149, 250, 0.28),
      0 10px 26px rgba(0, 0, 0, 0.45);
  }

  .labels {
    display: flex; justify-content: space-between; align-items: center;
    width: 104px; margin: 0 auto;
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em;
  }
  .lab { display: inline-flex; align-items: center; gap: 4px; }
  .sw { width: 8px; height: 8px; border-radius: 99px; }
  .sw.warm { background: #D07040; }
  .pane.yoru .sw.warm { background: #E08858; }
  .sw.cool { background: var(--primary-700); }
  .pane.yoru .sw.cool { background: var(--primary-500); }
  .lab .nm { opacity: 0.72; }

  .wm {
    text-align: center;
    font-family: var(--font-ui); font-weight: 600; font-size: 19px; letter-spacing: -0.012em;
    display: flex; align-items: baseline; gap: 6px; justify-content: center;
  }
  .wm .a { color: #E07E4A; }
  .pane.yoru .wm .a { color: #F2A070; }
  .wm .b { color: var(--primary-700); }
  .pane.yoru .wm .b { color: var(--primary-500); }
  .wm .x { opacity: 0.35; font-weight: 400; transform: translateY(-2px); display: inline-block; }
  .sub { text-align: center; font-family: var(--font-jp); font-size: 12px; opacity: 0.55; }
</style></head>
<body>
  <div class="grid">
    <div class="pane akari">
      <div class="mark"><div class="akari-side"></div><div class="yoru-side"></div></div>
      <div class="labels">
        <span class="lab"><span class="sw warm"></span><span class="nm">akari · 灯</span></span>
        <span class="lab"><span class="nm">yoru · 夜</span><span class="sw cool"></span></span>
      </div>
      <div class="wm"><span class="a">akari</span><span class="x">·</span><span class="b">yoru</span></div>
      <div class="sub">灯と夜 — the lamp and the night</div>
    </div>
    <div class="pane yoru" data-theme="yoru">
      <div class="mark"><div class="akari-side"></div><div class="yoru-side"></div></div>
      <div class="labels">
        <span class="lab"><span class="sw warm"></span><span class="nm">akari · 灯</span></span>
        <span class="lab"><span class="nm">yoru · 夜</span><span class="sw cool"></span></span>
      </div>
      <div class="wm"><span class="a">akari</span><span class="x">·</span><span class="b">yoru</span></div>
      <div class="sub">灯と夜 — the lamp and the night</div>
    </div>
  </div>
</body></html>
