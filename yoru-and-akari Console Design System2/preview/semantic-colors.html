<!doctype html>
<!-- @dsCard group="Colors" name="Semantic colors" subtitle="success · warning · error · info — both themes" viewport="700x240" --><html><head><meta charset="utf-8"><title>semantic colors</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 16px 18px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .item { border-radius: var(--radius-md); padding: 12px; background: var(--bg-surface); box-shadow: var(--shadow-flat); }
  .dot { width: 10px; height: 10px; border-radius: 99px; display: inline-block; vertical-align: middle; margin-right: 6px; }
  .nm { font-size: 12px; font-weight: 600; color: var(--ink-1); }
  .hx { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); margin-top: 2px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 99px; font-size: 11px; font-weight: 500; margin-top: 10px; }
  h4 { margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
  .group + .group { margin-top: 14px; }
</style></head>
<body data-theme="akari">
  <div class="group">
    <h4>Semantic — akari</h4>
    <div class="row">
      <div class="item"><div class="nm"><span class="dot" style="background:#2BA672"></span>success</div><div class="hx">#2BA672</div><span class="pill" style="background:#DCF3E8; color:#1F7E58">saved</span></div>
      <div class="item"><div class="nm"><span class="dot" style="background:#D89A3A"></span>warning</div><div class="hx">#D89A3A</div><span class="pill" style="background:#FBEAC9; color:#A57427">unsaved</span></div>
      <div class="item"><div class="nm"><span class="dot" style="background:#D45D5D"></span>error</div><div class="hx">#D45D5D</div><span class="pill" style="background:#FADBDB; color:#A23F3F">failed</span></div>
      <div class="item"><div class="nm"><span class="dot" style="background:#4F6CE8"></span>info</div><div class="hx">#4F6CE8</div><span class="pill" style="background:#DCE3FE; color:#2E44B0">syncing</span></div>
    </div>
  </div>
  <div class="group">
    <h4>Semantic — yoru</h4>
    <div class="row" style="background:#0B1020; padding:12px; border-radius:14px">
      <div class="item" style="background:#131A2E"><div class="nm" style="color:#E6EAF6"><span class="dot" style="background:#3FCB94"></span>success</div><div class="hx">#3FCB94</div><span class="pill" style="background:#143025; color:#7CE0B6">saved</span></div>
      <div class="item" style="background:#131A2E"><div class="nm" style="color:#E6EAF6"><span class="dot" style="background:#ECB85F"></span>warning</div><div class="hx">#ECB85F</div><span class="pill" style="background:#3A2E14; color:#F4D193">unsaved</span></div>
      <div class="item" style="background:#131A2E"><div class="nm" style="color:#E6EAF6"><span class="dot" style="background:#F08484"></span>error</div><div class="hx">#F08484</div><span class="pill" style="background:#3A1A1A; color:#F5B0B0">failed</span></div>
      <div class="item" style="background:#131A2E"><div class="nm" style="color:#E6EAF6"><span class="dot" style="background:#7A95FA"></span>info</div><div class="hx">#7A95FA</div><span class="pill" style="background:#1F2A55; color:#B4C3FC">syncing</span></div>
    </div>
  </div>
</body></html>
