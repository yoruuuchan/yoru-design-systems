<!doctype html>
<!-- @dsCard group="Colors" name="Semantic colors" subtitle="success · warning · error · info — both themes" viewport="700x240" --><html><head><meta charset="utf-8"><title>semantic colors</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 16px 18px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .item { border-radius: var(--radius-md); padding: 12px; background: var(--bg-surface); box-shadow: var(--shadow-flat); }
  .dot { width: 10px; height: 10px; border-radius: 99px; display: inline-block; vertical-align: middle; margin-right: 6px; }
  .nm { font-size: 12px; font-weight: 600; color: var(--ink-1); }
  .hx { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); margin-top: 2px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 99px; font-size: 11px; font-weight: 500; margin-top: 10px; }
  h4 { margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
  .group + .group { margin-top: 14px; }
</style></head>
<body data-theme="akari">
  <div class="group">
    <h4>Semantic — akari</h4>
    <div class="row">
      <div class="item"><div class="nm"><span class="dot" style="background:var(--success-500)"></span>success</div><div class="hx">#2BA672</div><span class="pill" style="background:var(--success-100); color:var(--success-700)">saved</span></div>
      <div class="item"><div class="nm"><span class="dot" style="background:var(--warning-500)"></span>warning</div><div class="hx">#D89A3A</div><span class="pill" style="background:var(--warning-100); color:var(--warning-700)">unsaved</span></div>
      <div class="item"><div class="nm"><span class="dot" style="background:var(--error-500)"></span>error</div><div class="hx">#D45D5D</div><span class="pill" style="background:var(--error-100); color:var(--error-700)">failed</span></div>
      <div class="item"><div class="nm"><span class="dot" style="background:var(--primary-500)"></span>info</div><div class="hx">#4F6CE8</div><span class="pill" style="background:var(--primary-100); color:var(--primary-700)">syncing</span></div>
    </div>
  </div>
  <div class="group">
    <h4>Semantic — yoru</h4>
    <div class="row" data-theme="yoru" style="background:var(--bg-base); padding:12px; border-radius:14px">
      <div class="item" style="background:var(--bg-surface)"><div class="nm" style="color:var(--ink-1)"><span class="dot" style="background:var(--success-500)"></span>success</div><div class="hx">#3FCB94</div><span class="pill" style="background:var(--success-100); color:var(--success-700)">saved</span></div>
      <div class="item" style="background:var(--bg-surface)"><div class="nm" style="color:var(--ink-1)"><span class="dot" style="background:var(--warning-500)"></span>warning</div><div class="hx">#ECB85F</div><span class="pill" style="background:var(--warning-100); color:var(--warning-700)">unsaved</span></div>
      <div class="item" style="background:var(--bg-surface)"><div class="nm" style="color:var(--ink-1)"><span class="dot" style="background:var(--error-500)"></span>error</div><div class="hx">#F08484</div><span class="pill" style="background:var(--error-100); color:var(--error-700)">failed</span></div>
      <div class="item" style="background:var(--bg-surface)"><div class="nm" style="color:var(--ink-1)"><span class="dot" style="background:var(--primary-500)"></span>info</div><div class="hx">#7A95FA</div><span class="pill" style="background:var(--primary-100); color:var(--primary-700)">syncing</span></div>
    </div>
  </div>
</body></html>
