<!-- @dsCard group="Components" viewport="700x360" name="Viz" subtitle="DataTable + ChartCard — sparkline + table" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 16px 18px; background: var(--bg-base); display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
</style>
</head>
<body>
<div id="root" style="display:contents"></div>
<script type="text/babel">
  const { ChartCard, DataTable, StatusPill, Badge } = window.KUNLUNDesignSystem_29e6df;
  const rows = [
    { id:"NODE-07", status:"online", power:142.3, ts:"21:04:55" },
    { id:"NODE-08", status:"online", power:128.1, ts:"21:04:54" },
    { id:"NODE-09", status:"busy",   power:97.6,  ts:"21:04:51" },
    { id:"NODE-12", status:"error",  power:0,     ts:"20:51:08" },
  ];
  const App = () => (
    <>
      <ChartCard
        label="// CORE-9 OUTPUT"
        value="142.3"
        unit="MW"
        delta="+12.4% · 24h"
        deltaDirection="up"
        series={[100, 110, 105, 120, 132, 128, 142]}
        badge={<StatusPill status="online">LIVE</StatusPill>}
      />
      <ChartCard
        label="// EDGE LATENCY"
        value="08.4"
        unit="ms"
        delta="-1.2 · 24h"
        deltaDirection="down"
        series={[14, 12, 13, 11, 10, 9, 8.4]}
        badge={<Badge variant="success">GOOD</Badge>}
      />
      <div style={{gridColumn:'1 / -1'}}>
        <DataTable
          rows={rows}
          columns={[
            { key:"id",     header:"NODE",   tone:"id" },
            { key:"status", header:"STATUS", render:v => <StatusPill status={v}>{String(v).toUpperCase()}</StatusPill> },
            { key:"power",  header:"MW",     align:"right", tone:"num" },
            { key:"ts",     header:"LAST PING", tone:"muted" },
          ]}
        />
      </div>
    </>
  );
  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body></html>
