    const [lines, setLines] = React.useState([
      { prompt:"$", text:"boot --node=07", kind:"user" },
      { text:"[ OK ] kernel loaded", kind:"success" },
      { text:"[ OK ] uplink established", kind:"success" },
      { text:"[ WARN ] coolant flow at 87%", kind:"warn" },
      { text:"node 07 online · waiting", kind:"muted" },

    return (
      <>
        <Terminal
          title="tty-07"
          height={320}
          lines={lines}
          onCommand={(c) => setLines((l) => [...l, { prompt:"$", text:c, kind:"user" }, { text:`bash: ${c}: command not found`, kind:"error" }])}
        />
        <CodeBlock lang="bash" code={`# boot the core
kunlun init --node 07
kunlun status

kunlun logs --follow`} />

    );
  };
  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
