<!-- @dsCard group="Spacing" viewport="700x160" name="Chamfer / Corners" subtitle="切角是品牌核心 — 0/2/sm/md/lg/all" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px; background: var(--bg-base); }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .box {
    height: 100px; background: var(--bg-panel); border: 1px solid var(--cyan-700);
    display: flex; align-items: center; justify-content: center;
    font: var(--type-label); text-transform: uppercase; color: var(--text-signal);
    letter-spacing: var(--tracking-wide);
  }
  .box.sq    { clip-path: none; }
  .box.xs    { clip-path: var(--clip-chamfer-sm); }
  .box.md    { clip-path: var(--clip-chamfer-md); }
  .box.lg    { clip-path: var(--clip-chamfer-lg); }
  .box.all   { clip-path: var(--clip-chamfer-all-md); }
</style></head>
<body>
  <div class="row">
    <div class="box sq">none</div>
    <div class="box xs">sm · 6px</div>
    <div class="box md">md · 12px</div>
    <div class="box lg">lg · 18px</div>
    <div class="box all">all · 8边</div>
  </div>
</body></html>
