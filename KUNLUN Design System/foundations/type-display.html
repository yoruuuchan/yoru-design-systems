<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px; background: var(--bg-base); }
  .hero {
    font-family: var(--font-display); font-weight: 900;
    font-size: 56px; line-height: 1; letter-spacing: var(--tracking-wide);
    color: var(--text-primary);
    text-shadow: var(--text-glow-cyan);
  }
  .sub {
    font-family: var(--font-display); font-weight: 700;
    font-size: 22px; letter-spacing: var(--tracking-wider);
    color: var(--text-signal); margin-top: 8px;
    text-transform: uppercase;
  }
  .meta {
    font-family: var(--font-mono); font-size: 10px;
    color: var(--text-tertiary); margin-top: 14px;
    letter-spacing: var(--tracking-wide);
  }
</style></head>
<body>
  <div class="hero">昆仑 / KUNLUN</div>
  <div class="sub">CORE-9 // ONLINE</div>
  <div class="meta">Orbitron · 56 / 22 · weight 900 / 700 · tracking +0.12em</div>
</body></html>
