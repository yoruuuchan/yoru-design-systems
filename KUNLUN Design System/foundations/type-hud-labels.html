<!-- @dsCard group="Type" viewport="700x160" name="HUD Labels" subtitle="大写、宽字距，用于装饰标签" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 18px; background: var(--bg-base); color: var(--text-primary); display:grid; gap: 12px; }
  .label { font: var(--type-label); text-transform: uppercase; letter-spacing: var(--tracking-widest); color: var(--text-tertiary); }
  .label.signal { color: var(--text-signal); text-shadow: var(--text-glow-cyan); }
  .label.warn   { color: var(--text-warn); }
  .label.danger { color: var(--text-danger); }
  .row { display: flex; gap: 24px; align-items: center; }
  .ascii { font-family: var(--font-mono); color: var(--hud-ink-bright); font-size: 12px; letter-spacing: 0.1em;}
</style></head>
<body>
  <div class="row">
    <span class="label">[ SECTOR · A ]</span>
    <span class="label signal">// NODE-07 · ONLINE</span>
    <span class="label warn">⚠ ALERT · LV2</span>
    <span class="label danger">⨯ FAULT · 0xE1</span>
  </div>
  <div class="ascii">[+] ─────── 01-A-7F ─────── [+]</div>
  <div class="ascii">┌── COORDINATES ──┐  37.5414° N · 112.9180° E</div>
</body></html>
