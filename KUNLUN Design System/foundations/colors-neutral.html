<!-- @dsCard group="Colors" viewport="700x140" name="Neutral / Grayscale" subtitle="正文 + chrome，9 级中性灰" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 12px; background: var(--bg-base); }
  .row { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; }
  .sw {
    height: 100px; padding: 6px;
    display: flex; flex-direction: column; justify-content: space-between;
    color: var(--bg-void);
    clip-path: var(--clip-chamfer-sm);
    border: 1px solid var(--border);
  }
  .sw.dark { color: var(--neutral-100); }
  .label { font: var(--type-label); text-transform: uppercase; opacity: 0.9; }
  .hex { font-family: var(--font-mono); font-size: 10px; opacity: 0.85; }
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--neutral-50)"><span class="label">50</span><span class="hex">F5F9FF</span></div>
    <div class="sw" style="background:var(--neutral-100)"><span class="label">100</span><span class="hex">E3EAF3</span></div>
    <div class="sw" style="background:var(--neutral-200)"><span class="label">200</span><span class="hex">C2CDDA</span></div>
    <div class="sw" style="background:var(--neutral-300)"><span class="label">300</span><span class="hex">95A3B4</span></div>
    <div class="sw dark" style="background:var(--neutral-400)"><span class="label">400</span><span class="hex">6C7A8C</span></div>
    <div class="sw dark" style="background:var(--neutral-500)"><span class="label">500</span><span class="hex">4D5A6E</span></div>
    <div class="sw dark" style="background:var(--neutral-600)"><span class="label">600</span><span class="hex">364154</span></div>
    <div class="sw dark" style="background:var(--neutral-700)"><span class="label">700</span><span class="hex">232C3D</span></div>
    <div class="sw dark" style="background:var(--neutral-800)"><span class="label">800</span><span class="hex">161E2C</span></div>
  </div>
</body></html>
