<!-- @dsCard group="Colors" viewport="700x140" name="Background Scale" subtitle="深空 → 面板 → 浮层，6 级深色基底" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 12px; }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .sw {
    position: relative;
    height: 100px;
    border: 1px solid var(--border);
    padding: 8px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    clip-path: var(--clip-chamfer-sm);
  }
  .label { font: var(--type-label); color: var(--text-tertiary); text-transform: uppercase; letter-spacing: var(--tracking-wide); }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--neutral-200); }
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--bg-void)"><span class="label">void</span><span class="hex">#04060A</span></div>
    <div class="sw" style="background:var(--bg-base)"><span class="label">base</span><span class="hex">#06080D</span></div>
    <div class="sw" style="background:var(--bg-surface)"><span class="label">surface</span><span class="hex">#0A0F17</span></div>
    <div class="sw" style="background:var(--bg-panel)"><span class="label">panel</span><span class="hex">#0D1320</span></div>
    <div class="sw" style="background:var(--bg-elevated)"><span class="label">elevated</span><span class="hex">#131A2A</span></div>
    <div class="sw" style="background:var(--bg-inset)"><span class="label">inset</span><span class="hex">#02040A</span></div>
  </div>
</body></html>
