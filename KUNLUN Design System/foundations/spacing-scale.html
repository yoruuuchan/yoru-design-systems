<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 14px; background: var(--bg-base); }
  .row { display: flex; gap: 12px; align-items: flex-end; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .block { background: var(--cyan-700); border-top: 2px solid var(--cyan-400); box-shadow: var(--glow-cyan-sm); }
  .label { font: var(--type-label); color: var(--text-tertiary); }
</style></head>
<body>
  <div class="row">
    <div class="col"><div class="block" style="width:14px; height:4px"></div><span class="label">1·4</span></div>
    <div class="col"><div class="block" style="width:14px; height:8px"></div><span class="label">2·8</span></div>
    <div class="col"><div class="block" style="width:14px; height:12px"></div><span class="label">3·12</span></div>
    <div class="col"><div class="block" style="width:14px; height:16px"></div><span class="label">4·16</span></div>
    <div class="col"><div class="block" style="width:14px; height:24px"></div><span class="label">6·24</span></div>
    <div class="col"><div class="block" style="width:14px; height:32px"></div><span class="label">8·32</span></div>
    <div class="col"><div class="block" style="width:14px; height:48px"></div><span class="label">12·48</span></div>
    <div class="col"><div class="block" style="width:14px; height:64px"></div><span class="label">16·64</span></div>
    <div class="col"><div class="block" style="width:14px; height:80px"></div><span class="label">20·80</span></div>
    <div class="col"><div class="block" style="width:14px; height:96px"></div><span class="label">24·96</span></div>
  </div>
</body></html>
