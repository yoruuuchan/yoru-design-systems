<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:20px 24px;background:#fff;font-family:var(--font-body);color:var(--ink-2)}.lbl{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-5)}.card{flex:1;padding:14px 16px;border:1px solid var(--line-1);display:flex;flex-direction:column;gap:12px;min-width:0}.hl{font-family:var(--font-title);font-weight:700;font-size:17px;background-image:var(--hand-underline);background-repeat:no-repeat;background-position:0 100%;background-size:100% 10px;padding-bottom:6px;color:var(--accent-ink);align-self:flex-start}</style></head><body>
<div style="display:flex;gap:14px;align-items:stretch">
<div class="card" data-yoru="signal"><span class="hl">新的默认模型</span><span class="lbl">signal · --deco-underline</span></div>
<div class="card" data-yoru="lab"><span class="hl">跑通了这段流程</span><span class="lbl">lab · --deco-underline</span></div>
<div class="card" data-yoru="studio"><span class="hl">配色是最后一步</span><span class="lbl">studio · --deco-underline</span></div>
<div class="card" data-yoru="special"><span class="hl">今天飞了四块电池</span><span class="lbl">special · --deco-underline</span></div>
</div>
<div style="margin-top:14px;font-size:11px;color:var(--ink-4);line-height:1.8">
每个变体各自的 <code style="font-family:var(--font-mono);font-size:10.5px">accent-hair</code> 色 · 4.4px 粗描边。<br>
一页最多出现一次；只放在标题、金句或强调短语下，不进正文段落。
</div></body></html>
