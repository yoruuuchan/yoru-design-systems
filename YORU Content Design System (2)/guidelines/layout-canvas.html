<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:20px 24px;background:#fff;font-family:var(--font-body);color:var(--ink-2)}.lbl{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-5)}.row{display:flex;gap:10px}</style></head><body>
<div style="display:flex;gap:28px;align-items:center">
<div style="position:relative;width:150px;height:200px;border:1px solid var(--line-2);background:#fff;flex:none">
<div style="position:absolute;inset:12.5px 11.6px;border:1px dashed var(--yoru-blue);background:var(--yoru-blue-soft)"></div>
<div style="position:absolute;left:11.6px;top:5px;font-family:var(--font-mono);font-size:7px;color:var(--yoru-blue)">月相行</div>
<div style="position:absolute;right:11.6px;bottom:4px;font-family:var(--font-fangsong);font-size:7px;color:var(--ink-5)">〇三 / 〇八</div>
</div>
<div style="flex:1;display:flex;flex-direction:column;gap:7px;font-size:12px;color:var(--ink-3)">
<div style="display:flex;gap:12px"><span class="lbl" style="width:66px;flex:none;color:var(--ink-2);padding-top:2px">画布</span><span>1242 × 1656 px（3:4），导出 @1x 即为小红书原图</span></div><div style="display:flex;gap:12px"><span class="lbl" style="width:66px;flex:none;color:var(--ink-2);padding-top:2px">左右边距</span><span>96 px，四个变体一致，任何情况下不收窄</span></div><div style="display:flex;gap:12px"><span class="lbl" style="width:66px;flex:none;color:var(--ink-2);padding-top:2px">上下边距</span><span>104 px，栏目角标与页码压在边距线上</span></div><div style="display:flex;gap:12px"><span class="lbl" style="width:66px;flex:none;color:var(--ink-2);padding-top:2px">正文栏宽</span><span>1050 px，单栏；对比表可占满栏宽</span></div><div style="display:flex;gap:12px"><span class="lbl" style="width:66px;flex:none;color:var(--ink-2);padding-top:2px">块间距</span><span>--flow-block（sp-6 = 76px），标题与正文之间 sp-3</span></div><div style="display:flex;gap:12px"><span class="lbl" style="width:66px;flex:none;color:var(--ink-2);padding-top:2px">出血</span><span>仅 Figure treatment=bleed 允许突破边距</span></div>
</div></div></body></html>
