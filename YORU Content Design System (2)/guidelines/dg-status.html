<script type="text/babel" data-presets="react">
const NS = window.YORUContentDesignSystem_a0b73e;

const {DiagramNode}=NS;
function Demo(){return <div data-yoru="lab" className="yoru-diagram" style={{display:"flex",gap:16}}>
  {[["verified","跑通了"],["failed","这条崩了"],["unknown","没测过"]].map(([s,l])=>
    <div key={s} style={{flex:1}}><DiagramNode role="process" status={s} statusLabel label={l} meta="node.status" style={{minHeight:88}}/></div>)}

</div>}

ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
