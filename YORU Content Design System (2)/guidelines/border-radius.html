<!-- @dsCard group="Borders" viewport="700x150" name="Radii & hairlines" subtitle="默认接近直角；圆角是 Studio / Special 的变体特权" -->
<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:20px 24px;background:#fff;font-family:var(--font-body);color:var(--ink-2)}.lbl{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-5)}.row{display:flex;gap:10px}</style></head><body>
<div style="display:flex;gap:12px">
<div style="flex:1"><div style="height:44px;border:1px solid var(--line-2);border-radius:0px;background:var(--paper-3)"></div><div class="lbl" style="margin-top:6px;color:var(--ink-2)">radius-0</div><div style="font-size:10px;color:var(--ink-4);margin-top:2px">Signal/Lab 标签</div></div><div style="flex:1"><div style="height:44px;border:1px solid var(--line-2);border-radius:2px;background:var(--paper-3)"></div><div class="lbl" style="margin-top:6px;color:var(--ink-2)">radius-1</div><div style="font-size:10px;color:var(--ink-4);margin-top:2px">默认块 · 图片</div></div><div style="flex:1"><div style="height:44px;border:1px solid var(--line-2);border-radius:6px;background:var(--paper-3)"></div><div class="lbl" style="margin-top:6px;color:var(--ink-2)">radius-2</div><div style="font-size:10px;color:var(--ink-4);margin-top:2px">Studio 块</div></div><div style="flex:1"><div style="height:44px;border:1px solid var(--line-2);border-radius:12px;background:var(--paper-3)"></div><div class="lbl" style="margin-top:6px;color:var(--ink-2)">radius-3</div><div style="font-size:10px;color:var(--ink-4);margin-top:2px">少用 · 大图</div></div><div style="flex:1"><div style="height:44px;border:1px solid var(--line-2);border-radius:999px;background:var(--paper-3)"></div><div class="lbl" style="margin-top:6px;color:var(--ink-2)">radius-pill</div><div style="font-size:10px;color:var(--ink-4);margin-top:2px">Studio/Special 标签</div></div>
<div style="flex:1.1;display:flex;flex-direction:column;gap:5px;justify-content:center">
<div style="border-top:1px solid var(--line-1)"></div><span class="lbl">hair 1px · line-1</span>
<div style="border-top:2px solid var(--line-3)"></div><span class="lbl">rule 2px · line-3</span>
<div style="border-top:3px solid var(--line-3)"></div><span class="lbl">bar 3px · 标题上方横线</span>
</div></div></body></html>
