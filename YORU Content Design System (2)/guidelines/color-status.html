<!-- @dsCard group="Colors" viewport="700x120" name="Status colors" subtitle="只允许出现在 StatusLabel 与 Callout 上，正文永不着色" -->
<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:20px 24px;background:#fff;font-family:var(--font-body);color:var(--ink-2)}.lbl{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-5)}.row{display:flex;gap:10px}</style></head><body>
<div class="row">
<div style="flex:1;background:var(--ok-soft);border-top:2px solid var(--ok);border-radius:0 0 2px 2px;padding:10px 12px"><div class="lbl" style="color:var(--ok)">ok</div><div style="font-size:12px;color:var(--ink-3);margin-top:4px">推荐 / 通过</div></div><div style="flex:1;background:var(--warn-soft);border-top:2px solid var(--warn);border-radius:0 0 2px 2px;padding:10px 12px"><div class="lbl" style="color:var(--warn)">warn</div><div style="font-size:12px;color:var(--ink-3);margin-top:4px">注意 / 有前提</div></div><div style="flex:1;background:var(--stop-soft);border-top:2px solid var(--stop);border-radius:0 0 2px 2px;padding:10px 12px"><div class="lbl" style="color:var(--stop)">stop</div><div style="font-size:12px;color:var(--ink-3);margin-top:4px">避坑 / 别用</div></div><div style="flex:1;background:var(--note-soft);border-top:2px solid var(--note);border-radius:0 0 2px 2px;padding:10px 12px"><div class="lbl" style="color:var(--note)">note</div><div style="font-size:12px;color:var(--ink-3);margin-top:4px">备注 / 中性</div></div>
</div></body></html>
