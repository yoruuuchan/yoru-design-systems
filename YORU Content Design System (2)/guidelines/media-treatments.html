<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:20px 24px;background:#fff;font-family:var(--font-body);color:var(--ink-2)}.lbl{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-5)}.row{display:flex;gap:10px}</style></head><body>
<div style="display:flex;gap:16px">
<div style="flex:1"><div style="height:100px;border-radius:2px;border:1px solid var(--line-2);box-shadow:0 1px 2px rgba(17,24,39,.06),0 8px 24px rgba(17,24,39,.08);background:var(--paper-2);display:flex;align-items:center;justify-content:center"><span class="lbl">frame</span></div><div class="lbl" style="margin-top:8px;color:var(--ink-2)">treatment="frame"</div><div style="font-size:11px;color:var(--ink-4);margin-top:3px">截图</div></div><div style="flex:1"><div style="height:100px;border-radius:2px;background:var(--paper-3);display:flex;align-items:center;justify-content:center"><span class="lbl">inset</span></div><div class="lbl" style="margin-top:8px;color:var(--ink-2)">treatment="inset"</div><div style="font-size:11px;color:var(--ink-4);margin-top:3px">示意图 · 数据</div></div><div style="flex:1"><div style="height:100px;border-radius:2px;background:var(--ink-6);border-radius:0;display:flex;align-items:center;justify-content:center"><span class="lbl">bleed</span></div><div class="lbl" style="margin-top:8px;color:var(--ink-2)">treatment="bleed"</div><div style="font-size:11px;color:var(--ink-4);margin-top:3px">作品图 · 摄影</div></div>
</div><div style="margin-top:14px;font-size:11px;color:var(--ink-4)">投影只出现在图片下方。文字块、卡片、标签一律没有投影。</div></body></html>
