<!-- @dsCard group="Spacing" viewport="700x160" name="Rules & radii" subtitle="Three rule weights carry hierarchy. Radius is zero." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:22px 26px;background:var(--surface-page)}body::before{opacity:.03}.row{display:flex;align-items:flex-end;gap:0}.lab{font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)}</style>
</head><body><div style="display:grid;gap:13px">
<div><div style="height:1px;background:var(--rule-hair)"></div><div class="lab" style="margin-top:6px">1px --rule-hair · within a section</div></div>
<div><div style="height:1px;background:var(--rule-strong)"></div><div class="lab" style="margin-top:6px">1px --rule-strong · between sections</div></div>
<div><div style="height:3px;background:var(--rule-strong)"></div><div style="height:1px;background:var(--rule-strong);margin-top:2px"></div><div class="lab" style="margin-top:6px">3px + 1px · issue covers and chapter breaks only</div></div>
<div class="lab">--radius-0: 0 everywhere · 2px exists for tape and stamps · 999px for the E/A mode discs</div>
</div></body></html>
