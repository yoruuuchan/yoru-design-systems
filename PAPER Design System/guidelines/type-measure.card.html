<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:22px 26px;background:var(--surface-page)}body::before{opacity:.03}.row{display:flex;align-items:flex-end;gap:0}.lab{font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)}</style>
</head><body><div style="display:grid;gap:10px">
<div style="max-width:44ch;background:var(--rust-100);height:10px"></div><div class="lab">44ch — narrow: sidebars, captions, exhibition labels</div>
<div style="max-width:66ch;background:var(--paper-400);height:10px"></div><div class="lab">66ch — the reading measure</div>
<div style="max-width:78ch;background:var(--paper-500);height:10px"></div><div class="lab">78ch — wide: single-column essays only</div>
</div></body></html>
