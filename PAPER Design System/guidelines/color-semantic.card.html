<div><div style="font-family:var(--font-serif);font-size:26px;color:var(--text-body)">Body</div><div class="lab" style="margin-top:8px">--text-body · 12.9:1</div></div>

<div><div style="font-family:var(--font-serif);font-size:26px;color:var(--text-muted)">Muted</div><div class="lab" style="margin-top:8px">--text-muted · 3.6:1 · 15px+</div></div>
</div></body></html>
