<!-- @dsCard group="Material" viewport="700x190" name="Analog details" subtitle="Film base, tape, date stamp, scan edge — one or two per spread, no more" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:22px 26px;background:var(--surface-page)}body::before{opacity:.03}.row{display:flex;align-items:flex-end;gap:0}.lab{font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)}</style>
</head><body><div style="display:flex;gap:28px;align-items:center">
<div><div style="width:118px;height:80px;background:var(--film-base);padding:5px;box-sizing:border-box"><div style="height:9px;background:var(--film-sprocket);opacity:.5"></div><div style="height:44px;background:var(--placeholder-tone);margin:4px 0"></div><div style="height:9px;background:var(--film-sprocket);opacity:.5"></div></div><div class="lab" style="margin-top:9px">film frame</div></div>
<div><div style="width:104px;height:26px;background:var(--tape);background-image:var(--tex-fibre);background-blend-mode:multiply;transform:rotate(-2deg);clip-path:polygon(2% 6%,14% 0,33% 7%,55% 1%,74% 8%,92% 2%,100% 12%,97% 92%,80% 100%,61% 93%,40% 100%,19% 92%,4% 99%,0 46%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)"></div><div class="lab" style="margin-top:22px">tape</div></div>
<div><span style="display:inline-block;font-family:var(--font-mono);font-size:12.5px;letter-spacing:.1em;color:var(--stamp-ink);border:1px solid var(--stamp-ink);padding:4px 8px;transform:rotate(-2.5deg);opacity:.88">APR 12 2026</span><div class="lab" style="margin-top:20px">date stamp</div></div>
<div><div style="position:relative;width:118px;height:80px;background:var(--placeholder-tone);box-shadow:inset 0 0 0 1px var(--frame-edge)"><span style="position:absolute;inset:0;background:var(--scan-edge)"></span></div><div class="lab" style="margin-top:9px">scan edge</div></div>
</div></body></html>
