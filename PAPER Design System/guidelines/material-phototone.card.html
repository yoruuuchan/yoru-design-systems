<!-- @dsCard group="Material" viewport="700x180" name="Photograph tone" subtitle="Every plate passes through one filter so a page reads as one shoot" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:22px 26px;background:var(--surface-page)}body::before{opacity:.03}.row{display:flex;align-items:flex-end;gap:0}.lab{font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)}</style>
</head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:18px">
<div><div style="height:104px;background:var(--placeholder-tone);filter:var(--photo-filter-editorial);box-shadow:inset 0 0 0 1px var(--frame-edge)"></div><div class="lab" style="margin-top:7px">editorial · saturate .9 contrast 1.02</div></div>
<div><div style="height:104px;background:var(--placeholder-tone);filter:var(--photo-filter-analog);box-shadow:inset 0 0 0 1px var(--frame-edge)"></div><div class="lab" style="margin-top:7px">analog · sepia .16 saturate .82</div></div>
</div></body></html>
