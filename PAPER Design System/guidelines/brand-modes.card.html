<!-- @dsCard group="Brand" viewport="700x180" name="Two voices" subtitle="One family, one grid, two settings — switch with data-mode" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:22px 26px;background:var(--surface-page)}body::before{opacity:.03}.row{display:flex;align-items:flex-end;gap:0}.lab{font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)}</style>
</head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:36px">
<div style="display:flex;gap:14px;align-items:center"><span style="width:38px;height:38px;flex:none;border-radius:999px;background:var(--ink-800);color:var(--paper-100);display:grid;place-items:center;font-family:var(--font-display);font-size:17px">E</span><div><div style="font-family:var(--font-sans);font-size:13px;font-weight:500;color:var(--text-body)">editorial mode</div><div style="font-family:var(--font-sans);font-size:12.5px;color:var(--text-muted)">clear, structured, typographic</div></div></div>
<div style="display:flex;gap:14px;align-items:center"><span style="width:38px;height:38px;flex:none;border-radius:999px;background:var(--paper-400);color:var(--ink-800);display:grid;place-items:center;font-family:var(--font-display);font-size:17px">A</span><div><div style="font-family:var(--font-sans);font-size:13px;font-weight:500;color:var(--text-body)">analog mode</div><div style="font-family:var(--font-sans);font-size:12.5px;color:var(--text-muted)">tactile, warm, archival</div></div></div>
</div>
<div class="lab" style="margin-top:26px">&lt;article data-mode="analog"&gt; — scopes to a whole page or one figure. Structure first, texture second.</div></body></html>
