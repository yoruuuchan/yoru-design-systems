<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="./styles.css">
<style>html,body{margin:0;height:100%}body::before{opacity:.05}.tile{display:grid;grid-template-columns:1fr 200px;width:1280px;height:854px}
.main{background:var(--paper-200);display:grid;place-items:center;padding:0 60px}
.mark{font-family:var(--font-display);font-size:210px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-900);line-height:1;white-space:nowrap}
.strip{display:grid;grid-template-rows:repeat(4,1fr)}</style>
</head><body><div class="tile">
<div class="main"><div class="mark">Paper</div></div>
<div class="strip"><div style="background:var(--rust-300)"></div><div style="background:var(--rust-500)"></div><div style="background:var(--slate-600)"></div><div style="background:var(--ink-900)"></div></div>
</div></body></html>
