<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}.slide{width:1280px;height:720px;background:var(--surface-page);position:relative;overflow:hidden;display:flex;flex-direction:column;padding:56px 72px;box-sizing:border-box}
.rh{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint)}
.ft{margin-top:auto;display:flex;justify-content:space-between;align-items:baseline;padding-top:18px;border-top:1px solid var(--rule-hair);font-family:var(--font-sans);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)}
.pg{font-family:var(--font-display);font-size:26px;letter-spacing:0;text-transform:none;color:var(--text-display)}
.kick{font-family:var(--font-mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-accent)}

</style></head><body><div class="slide"><div class="rh"><span>Interview</span><span>05</span></div>
<blockquote style="margin:auto 0;display:grid;grid-template-columns:64px 1fr;column-gap:24px">
<span aria-hidden="true" style="font-family:var(--font-display);font-size:104px;line-height:.62;color:var(--rust-300)">&#8220;</span>
<p style="font-family:var(--font-display);font-size:76px;line-height:1.1;letter-spacing:-.01em;margin:0;text-wrap:balance">You cannot photograph the return of the light. You can only photograph the things it lands on.</p>
<cite style="grid-column:2;display:flex;justify-content:space-between;align-items:baseline;font-style:normal;font-family:var(--font-sans);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-muted);margin-top:44px;padding-top:16px;border-top:1px solid var(--rule-hair)"><span>M. Sørensen</span><span>Interview, 2025</span></cite>
</blockquote>
<div class="ft"><span>Paper — Issue Nº 04</span><span></span><span class="pg">05</span></div></div></body></html>
