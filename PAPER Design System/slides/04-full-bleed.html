<!-- @dsCard group="Slides" viewport="1280x720" name="04 — Full bleed" subtitle="One photograph, edge to edge, with a caption bar" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}.slide{width:1280px;height:720px;background:var(--surface-page);position:relative;overflow:hidden;display:flex;flex-direction:column;padding:56px 72px;box-sizing:border-box}
.rh{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint)}
.ft{margin-top:auto;display:flex;justify-content:space-between;align-items:baseline;padding-top:18px;border-top:1px solid var(--rule-hair);font-family:var(--font-sans);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)}
.pg{font-family:var(--font-display);font-size:26px;letter-spacing:0;text-transform:none;color:var(--text-display)}
.kick{font-family:var(--font-mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-accent)}
.ph{background:var(--placeholder-tone);box-shadow:inset 0 0 0 1px var(--frame-edge);filter:var(--photo-filter-editorial)}
</style></head><body><div class="slide"><div class="ph" style="position:absolute;inset:0;filter:var(--photo-filter-editorial)"></div>
<div style="position:absolute;left:0;right:0;bottom:0;background:var(--surface-page);padding:20px 72px;display:flex;justify-content:space-between;align-items:baseline">
<span style="font-family:var(--font-sans);font-size:15px;color:var(--text-body)"><span style="font-family:var(--font-mono);color:var(--text-accent)">Fig. 04 </span> Klitmøller, low tide at the turn inland, 18:40.</span>
<span style="font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint)">Kodak Tri-X 400</span></div></div></body></html>
