<!-- @dsCard group="Slides" viewport="1280x720" name="07 — Credits / closing" subtitle="Wordmark, credits in two columns, one written line" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}.slide{width:1280px;height:720px;background:var(--surface-page);position:relative;overflow:hidden;display:flex;flex-direction:column;padding:56px 72px;box-sizing:border-box}
.rh{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint)}
.ft{margin-top:auto;display:flex;justify-content:space-between;align-items:baseline;padding-top:18px;border-top:1px solid var(--rule-hair);font-family:var(--font-sans);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)}
.pg{font-family:var(--font-display);font-size:26px;letter-spacing:0;text-transform:none;color:var(--text-display)}
.kick{font-family:var(--font-mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-accent)}
.ph{background:var(--placeholder-tone);box-shadow:inset 0 0 0 1px var(--frame-edge);filter:var(--photo-filter-editorial)}
</style></head><body><div class="slide"><div class="rh"><span>Paper</span><span>Colophon</span></div>
<div style="margin:auto 0">
<div style="font-family:var(--font-display);font-size:74px;letter-spacing:.42em;text-transform:uppercase;line-height:1">Paper</div>
<div style="font-family:var(--font-serif);font-style:italic;font-size:24px;color:var(--text-secondary);margin-top:18px">editorial × analog design system</div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,240px));gap:44px;margin-top:56px">
<div><div style="font-family:var(--font-sans);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint)">Photography</div><div style="font-family:var(--font-serif);font-size:19px;margin-top:6px">Mira Andersson</div></div>
<div><div style="font-family:var(--font-sans);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint)">Printing</div><div style="font-family:var(--font-serif);font-size:19px;margin-top:6px">Narayana Press, Odder</div></div>
<div><div style="font-family:var(--font-sans);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint)">Stock</div><div style="font-family:var(--font-serif);font-size:19px;margin-top:6px">Munken Pure Rough 120</div></div>
</div></div>
<div class="ft"><span style="font-family:var(--font-hand);font-size:22px;letter-spacing:0;text-transform:none;color:var(--hand-ink)">Built for clarity. Made to be kept.</span><span></span><span class="pg">07</span></div></div></body></html>
