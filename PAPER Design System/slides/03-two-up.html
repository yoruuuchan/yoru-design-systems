<!-- @dsCard group="Slides" viewport="1280x720" name="03 — Image + text" subtitle="The default content slide: one plate, one idea, a caption" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}.slide{width:1280px;height:720px;background:var(--surface-page);position:relative;overflow:hidden;display:flex;flex-direction:column;padding:56px 72px;box-sizing:border-box}
.rh{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint)}
.ft{margin-top:auto;display:flex;justify-content:space-between;align-items:baseline;padding-top:18px;border-top:1px solid var(--rule-hair);font-family:var(--font-sans);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)}
.pg{font-family:var(--font-display);font-size:26px;letter-spacing:0;text-transform:none;color:var(--text-display)}
.kick{font-family:var(--font-mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-accent)}
.ph{background:var(--placeholder-tone);box-shadow:inset 0 0 0 1px var(--frame-edge);filter:var(--photo-filter-editorial)}
</style></head><body><div class="slide"><div class="rh"><span>Field Notes</span><span>03</span></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center;margin:auto 0">
<div>
<div class="kick">Fig. 01</div>
<h3 style="font-family:var(--font-display);font-size:46px;line-height:1.08;margin-top:16px;max-width:15ch">The record is unremarkable on its own</h3>
<p style="font-family:var(--font-serif);font-size:20px;line-height:1.65;color:var(--text-body);margin-top:24px;max-width:40ch">Sunrise times, film stock, the temperature at the moment of exposure. It becomes something else entirely when read in sequence.</p>
<p lang="zh" style="font-family:var(--font-serif);font-size:18px;line-height:1.9;color:var(--text-secondary);margin-top:20px;max-width:28ch">按顺序读下来，它就成了别的东西。</p>
</div>
<figure style="margin:0"><div class="ph" style="aspect-ratio:4/5"></div>
<figcaption style="display:flex;gap:14px;font-family:var(--font-sans);font-size:14px;line-height:1.5;color:var(--text-muted);margin-top:12px"><span style="font-family:var(--font-mono);color:var(--text-accent)">Fig. 01</span><span>Låtefossen at first light, 06:12.</span></figcaption></figure>
</div>
<div class="ft"><span>Paper — Issue Nº 04</span><span>The Slow Return of Winter Light</span><span class="pg">03</span></div></div></body></html>
