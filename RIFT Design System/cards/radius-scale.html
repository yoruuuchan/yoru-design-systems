<!-- @dsCard group="Spacing" viewport="700x140" name="Radius scale" subtitle="xs · sm · md · lg · xl · 2xl · pill" -->
<!DOCTYPE html>
<html data-theme="dark">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { padding: 16px 22px; }
    .row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
    .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .sw { width: 56px; height: 56px; background: var(--glass-2-bg); border: 1px solid var(--glass-border); box-shadow: inset 0 1px 0 var(--glass-inner-hi); }
    .tok { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; color: var(--ink-2); }
    .val { font-family: var(--font-mono); font-size: 9px; color: var(--ink-3); }
  </style>
</head>
<body>
  <div class="row">
    <div class="cell"><div class="sw" style="border-radius: var(--r-xs)"></div><span class="tok">xs</span><span class="val">6</span></div>
    <div class="cell"><div class="sw" style="border-radius: var(--r-sm)"></div><span class="tok">sm</span><span class="val">10</span></div>
    <div class="cell"><div class="sw" style="border-radius: var(--r-md)"></div><span class="tok">md</span><span class="val">14</span></div>
    <div class="cell"><div class="sw" style="border-radius: var(--r-lg)"></div><span class="tok">lg</span><span class="val">18</span></div>
    <div class="cell"><div class="sw" style="border-radius: var(--r-xl)"></div><span class="tok">xl</span><span class="val">24</span></div>
    <div class="cell"><div class="sw" style="border-radius: var(--r-2xl)"></div><span class="tok">2xl</span><span class="val">32</span></div>
    <div class="cell"><div class="sw" style="border-radius: var(--r-pill); width: 96px"></div><span class="tok">pill</span><span class="val">999</span></div>
  </div>
  <script src="../assets/theme-toggle.js"></script>
</body>
</html>
