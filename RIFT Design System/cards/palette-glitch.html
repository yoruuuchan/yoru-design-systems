<!-- @dsCard group="Colors" viewport="700x150" name="Chromatic edge" subtitle="The duotone signature — re-channelled by data-accent" -->
<!DOCTYPE html>
<html data-theme="dark">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { padding: 18px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: center; }
    .group { display: flex; align-items: center; gap: 18px; }
    .swatches { display: flex; gap: 8px; }
    .sw { width: 44px; height: 44px; border-radius: var(--r-sm);
      border: 1px solid var(--line-1); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); }
    .meta { display: flex; flex-direction: column; gap: 2px; font-family: var(--font-mono);
      font-size: 10px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.1em; }
    .meta b { color: var(--ink-1); font-weight: 600; font-size: 11px; }
    .preview { font-family: var(--font-wordmark); font-weight: 700; font-size: 42px;
      letter-spacing: 0.04em; color: var(--ink-1); margin-left: auto; }
  </style>
</head>
<body data-glitch="signature">
  <div class="group" data-accent="royal">
    <div class="swatches">
      <div class="sw" style="background: var(--sky)"></div>
      <div class="sw" style="background: var(--royal)"></div>
    </div>
    <div class="meta"><b>royal</b><span>sky · royal</span><span>default</span></div>
    <span class="rift-glitch preview" data-text="RIFT">RIFT</span>
  </div>
  <div class="group" data-accent="aqua">
    <div class="swatches">
      <div class="sw" style="background: var(--aqua)"></div>
      <div class="sw" style="background: var(--royal)"></div>
    </div>
    <div class="meta"><b>aqua</b><span>aqua · royal</span></div>
    <span class="rift-glitch preview" data-text="RIFT">RIFT</span>
  </div>
  <script src="../assets/theme-toggle.js"></script>
</body>
</html>
