<!-- @dsCard group="Type" viewport="700x130" name="Italic accent · DM Serif Display" subtitle="One serif italic — sparingly, for emphasis" -->
<!DOCTYPE html>
<html data-theme="dark">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { padding: 18px 24px; }
    .name { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.16em; color: var(--ink-3); text-transform: uppercase; margin-bottom: 8px; }
    .sample { font-family: var(--font-italic); font-style: italic; font-size: 38px; line-height: 1.1; color: var(--ink-1); }
    .sample em { color: var(--royal); }
  </style>
</head>
<body>
  <div class="name">--font-italic · DM Serif Display</div>
  <div class="sample">Listen — there is a <em>seam</em> in the signal.</div>
  <script src="../assets/theme-toggle.js"></script>
</body>
</html>
