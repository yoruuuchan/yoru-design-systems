<!-- @dsCard group="Type" viewport="700x150" name="UI · Rajdhani" subtitle="The everyday interface family" -->
<!DOCTYPE html>
<html data-theme="dark">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { padding: 18px 24px; }
    .name { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.16em; color: var(--ink-3); text-transform: uppercase; margin-bottom: 8px; }
    .row { display: flex; align-items: baseline; gap: 18px; font-family: var(--font-ui); }
    .sz { color: var(--ink-3); font-family: var(--font-mono); font-size: 10px; width: 56px; text-transform: uppercase; }
    .l { color: var(--ink-1); }
  </style>
</head>
<body>
  <div class="name">--font-ui · Rajdhani · default body</div>
  <div class="row"><span class="sz">700</span><span class="l" style="font-weight:700;font-size:18px">ENTER CONSOLE</span></div>
  <div class="row"><span class="sz">600</span><span class="l" style="font-weight:600;font-size:15px">View 47 active streams</span></div>
  <div class="row"><span class="sz">500</span><span class="l" style="font-weight:500;font-size:13px;color:var(--ink-2)">Default body — packets ingested every 200ms.</span></div>
  <div class="row"><span class="sz">400</span><span class="l" style="font-weight:400;font-size:12px;color:var(--ink-3)">Helper text and timestamps</span></div>
  <script src="../assets/theme-toggle.js"></script>
</body>
</html>
