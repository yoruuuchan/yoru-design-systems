<!DOCTYPE html>
<html data-theme="light">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { padding: 18px 24px; }
    .row { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; }
    .cell { border-radius: var(--r-sm); padding: 14px 14px 12px; border: 1px solid var(--line-1);
      min-height: 90px; display: flex; flex-direction: column; justify-content: space-between; }
    .name { font-family: var(--font-ui); font-weight: 600; color: var(--ink-1); font-size: 13px; }
    .hex { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); letter-spacing: 0.08em; }
  </style>
</head>
<body>
  <div class="row">
    <div class="cell" style="background: var(--bg-sunken)"><span class="name">sunken</span><span class="hex">--bg-sunken · DCE7F8</span></div>
    <div class="cell" style="background: var(--bg-base)"><span class="name">base</span><span class="hex">--bg-base · EAF1FC</span></div>
    <div class="cell" style="background: var(--bg-surface)"><span class="name">surface</span><span class="hex">--bg-surface · F4F8FF</span></div>
    <div class="cell" style="background: var(--bg-elevated)"><span class="name">elevated</span><span class="hex">--bg-elevated · FAFCFF</span></div>
  </div>
  <script src="../assets/theme-toggle.js"></script>
</body>
</html>
