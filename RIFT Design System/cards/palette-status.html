<!-- @dsCard group="Colors" viewport="700x140" name="Status colors" subtitle="ok · warn · bad" -->
<!DOCTYPE html>
<html data-theme="dark">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { padding: 22px 24px; }
    .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
    .cell { display: flex; flex-direction: column; gap: 10px; }
    .sw { height: 56px; border-radius: var(--r-sm); border: 1px solid var(--line-1);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); }
    .meta { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.1em; }
    .meta b { color: var(--ink-1); font-weight: 600; }
    .dot { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }
  </style>
</head>
<body>
  <div class="row">
    <div class="cell">
      <div class="sw" style="background: var(--ok)"></div>
      <div class="meta"><b>ok</b><span>4DCB97</span></div>
      <span class="dot"><span class="rift-dot rift-dot--ok"></span> CONNECTED</span>
    </div>
    <div class="cell">
      <div class="sw" style="background: var(--warn)"></div>
      <div class="meta"><b>warn</b><span>ECB85F</span></div>
      <span class="dot"><span class="rift-dot rift-dot--warn"></span> DEGRADED</span>
    </div>
    <div class="cell">
      <div class="sw" style="background: var(--bad)"></div>
      <div class="meta"><b>bad</b><span>FF7480</span></div>
      <span class="dot"><span class="rift-dot rift-dot--bad"></span> OFFLINE</span>
    </div>
  </div>
  <script src="../assets/theme-toggle.js"></script>
</body>
</html>
