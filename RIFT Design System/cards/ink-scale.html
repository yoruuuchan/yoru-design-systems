<!-- @dsCard group="Colors" viewport="700x140" name="Ink scale" subtitle="ink-1 (high) → ink-4 (whisper)" -->
<!DOCTYPE html>
<html data-theme="dark">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { padding: 22px 24px; display: flex; flex-direction: column; gap: 8px; }
    .row { display: flex; align-items: baseline; gap: 18px; }
    .name { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.16em;
      color: var(--ink-3); text-transform: uppercase; width: 76px; }
    .sample { font-family: var(--font-display); font-size: 20px; font-weight: 500; }
    .hex { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); margin-left: auto; }
  </style>
</head>
<body>
  <div class="row"><span class="name">ink-1</span><span class="sample" style="color: var(--ink-1)">The chromatic edge holds.</span><span class="hex">EDF2FF</span></div>
  <div class="row"><span class="name">ink-2</span><span class="sample" style="color: var(--ink-2)">The chromatic edge holds.</span><span class="hex">A7B4D2</span></div>
  <div class="row"><span class="name">ink-3</span><span class="sample" style="color: var(--ink-3)">The chromatic edge holds.</span><span class="hex">6B7896</span></div>
  <div class="row"><span class="name">ink-4</span><span class="sample" style="color: var(--ink-4)">The chromatic edge holds.</span><span class="hex">3E4866</span></div>
  <script src="../assets/theme-toggle.js"></script>
</body>
</html>
